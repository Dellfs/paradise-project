 {k:'pedar',ic:IC.pedar,name:["Novel pedar","Novel pedar"],tag:["In-shoe drukmeting","In-shoe pressure"],who:["Zorgteam (DFC)","Care team (DFC)"],

    ["Koppel per toestel het configuratiebestand met de code van de zool en controleer letter voor letter: bij een verkeerde koppeling waarschuwt de software niet.","Link each device to the configuration file with the insole's code and check it letter by letter: the software does not warn about a wrong link."]

    ["De pedar-zool ligt tussen de voet en de CMFO, vlak en zonder plooien; dunne naadloze katoenen sokken.","The pedar insole lies between the foot and the CMFO, flat and without folds; thin seamless cotton socks."],

 {k:'mm',ic:IC.mm,name:["MoveMonitor (DynaPort)","MoveMonitor (DynaPort)"],tag:["Fysieke activiteit","Physical activity"],who:["Zorgteam (DFC)","Care team (DFC)"],

    ["Project Usual Care of Optimal Care. Subject code: de deelnemerscode, zonder voorvoegsel, dezelfde als in alle andere software. Year of Birth 1900; gewicht, lengte en geslacht van de deelnemer.","Project Usual Care or Optimal Care. Subject code: the participant code, without prefix, the same as in all other software. Year of Birth 1900; the participant's weight, height and sex."]

   {phase:["Toewijzen en starten","Assign and start"],items:[

   ]},

   ]},
   {phase:["Terug en verwerken (visite 2)","Return and process (visit 2)"],items:[

    ["Laad het rapport 'Physical activity overview' in de tool <b>Therapietrouw</b>, stap 1 (ledenportaal). Die leest per dag opstaan en slapengaan en geeft de waaktijd en de norm. Beide op eCRF 28; de norm gaat bij Hours/day in de Orthotimer, in beide armen.","Load the 'Physical activity overview' report into the <b>Adherence</b> tool, step 1 (members' portal). It reads getting up and going to bed per day and gives the waking time and the norm. Both on eCRF 28; the norm goes under Hours/day in the Orthotimer, in both arms."]

  steps:[

 if(d.k==='ot'){h+='<div class="sh">'+tr(["Adherentie-feedback (SEBIA)","Adherence feedback (SEBIA)"])+'</div>'+feedback()+'<div class="note tip" style="margin-top:14px"><span class="lab">'+tr(["Rekenvoorbeeld","Worked example"])+'</span>'+tr(["Waaktijd uit de MoveMonitor-week: 15,5 u/dag. Norm: 80% daarvan, 12,4 u/dag; dat getal gaat bij Hours/day in de Orthotimer (eCRF 28). Uitgelezen: gemiddeld 11,2 u/dag. Dat is 72% van de waaktijd en 90% van de norm: de norm is niet gehaald. Op eCRF 32 noteert u 90%. Wie in de tool Therapietrouw de norm invult in plaats van de waaktijd, past de 80% twee keer toe en ziet ten onrechte 113%.","Waking time from the MoveMonitor week: 15.5 h/day. Norm: 80% of it, 12.4 h/day; that figure goes under Hours/day in the Orthotimer (eCRF 28). Read out: on average 11.2 h/day. That is 72% of waking time and 90% of the norm: the norm is not met. On eCRF 32 you record 90%. Entering the norm instead of the waking time in the Adherence tool applies the 80% twice and wrongly shows 113%."])+'</div>';}

 +'<li>'+tr(["De Orthotimer zit in het paar dat gedragen wordt. Bij verhuizing: nieuw toestelnummer registreren (eCRF 33).","The Orthotimer sits in the pair being worn. If it moves: record the new device number (eCRF 33)."])+'</li>'
 +'</ul>';
h+='<div class="note tip" style="margin-top:12px"><span class="lab">'+tr(["Schoeiselcriterium","Footwear criterion"])+'</span>'+tr(["Drie soorten schoenen komen in aanmerking, buiten én binnen: een goedgekeurde confectieschoen met extra diepte, een semi-orthopedische schoen of een orthopedische schoen (volledig maatwerk). Heeft de deelnemer maar één paar dat voldoet, dan wordt dat paar ook in huis gedragen. Goedgekeurde buiten- en binnenschoenen worden gedocumenteerd met foto's en een beschrijving, en er moet altijd plaats zijn voor de zool.","Three kinds of shoe qualify, outdoors and indoors: an approved extra-depth off-the-shelf shoe, a semi-orthopaedic shoe or an orthopaedic (fully custom-made) shoe. If the participant has only one pair that qualifies, that pair is worn indoors too. Approved outdoor and indoor shoes are documented with photos and a description, and there must always be room for the insole."])+'</div>';
