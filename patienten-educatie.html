<div class="px"><div class="topbar"><a href="index.html" class="bc-home">&#8592; Home</a><span class="kicker">PARADISE &#8212; Voor pati&#235;nten</span><span class="spacer"></span><button type="button" class="lang" id="lang">EN</button></div><div id="app"></div></div>
<script src="scripts/subpagina.js"></script>
<script>


window.RENDER=function(){
var h='';
/* ---- Title (niet als de pagina in het portaal ingebed is: daar staat de titel al) ---- */
if(!document.body.classList.contains('embedded')){
h+='<div class="kicker">'+tr(["Voor pati\u00ebnten","For patients"])+'</div>';
h+='<h1>'+tr(["Uw deelname aan het PARADISE-onderzoek","Your participation in the PARADISE study"])+'</h1>';
}

/* ---- What is PARADISE ---- */
h+='<div class="sh">'+tr(["Wat is PARADISE?","What is PARADISE?"])+'</div>';
h+='<div class="card" style="margin-bottom:14px"><p style="margin:0 0 10px;color:var(--soft)">'+tr(["PARADISE staat voor <em>Towards Pressure-Adherence &amp; Education Driven Service in Diabetic Foot Disease</em>. Het is een onderzoek van KU Leuven Campus Brugge, samen met de VUB en zes voetklinieken. We gaan na of het systematisch opvolgen van de druk onder uw voet en van hoe lang u uw schoenen draagt, samen met gerichte uitleg, een nieuwe voetwonde helpt voorkomen.","PARADISE stands for <em>Towards Pressure-Adherence &amp; Education Driven Service in Diabetic Foot Disease</em>. It is a research project of KU Leuven Campus Bruges, with the VUB and six foot clinics. We investigate whether systematically monitoring the pressure under your foot and how long you wear your shoes, together with targeted education, helps prevent a new foot wound."])+'</p>';
h+='<p style="margin:0;color:var(--soft)">'+tr(["Het project wordt gefinancierd door het FWO (Fonds voor Wetenschappelijk Onderzoek). Elke deelnemer wordt 18 maanden gevolgd. U kunt meedoen als u recent een voetwonde (voetulcus) had die genezen is, en aangepast schoeisel draagt of wilt dragen.","The project is funded by the FWO (Research Foundation Flanders). Each participant is followed for 18 months. You can take part if you recently had a foot ulcer that has healed, and you wear or are willing to wear custom footwear."])+'</p></div>';

/* ---- What do we ask ---- */
h+='<div class="sh">'+tr(["Wat vragen we van u?","What do we ask of you?"])+'</div>';
h+='<ul class="steps">';
h+='<li>'+tr(["<strong>Uw aangepast schoeisel dragen</strong> \u2014 altijd, van het moment dat u opstaat tot u gaat slapen, elke dag van de week.","<strong>Wear your custom footwear</strong> \u2014 always, from the moment you get up until you go to bed, every day of the week."])+'</li>';
h+='<li>'+tr(["<strong>Een bezoek om de 3 maanden</strong> \u2014 we lezen de sensor in uw zool uit en kijken uw voeten en schoenen na.","<strong>A visit every 3 months</strong> \u2014 we read the sensor in your insole and check your feet and shoes."])+'</li>';
h+='<li>'+tr(["<strong>E\u00e9n keer een activiteitenmonitor dragen</strong> \u2014 een volle week bij de start. Het toestel zit op uw onderrug en meet wanneer u slaapt en wanneer u op bent.","<strong>Wearing an activity monitor once</strong> \u2014 at the start you wear a small device on your lower back for 1 full week that records when you sleep and when you are up."])+'</li>';
h+='</ul>';

h+='<div class="note tip"><span class="lab">'+tr(["Waarom altijd?","Why always?"])+'</span>'+tr(["Drukverlagend schoeisel beschermt alleen wanneer u het draagt. In een grote Nederlandse studie kregen mensen die zulk schoeisel bij het grootste deel van hun stappen droegen, bijna half zo vaak een nieuwe wonde als met gewoon maatschoeisel. Elke stap zonder uw schoenen is een stap zonder bescherming, ook thuis.","Pressure-relieving footwear only protects you when you wear it. In a large Dutch study, people who wore such footwear for most of their steps developed a new wound almost half as often as with ordinary custom footwear. Every step without your shoes is a step without protection, at home too."])+'</div>';

/* ---- The devices ---- */
h+='<div class="sh">'+tr(["De meettoestellen","The measurement devices"])+'</div>';
h+='<div class="grid2" style="margin-bottom:14px">';

/* Orthotimer */
h+='<div class="card">';
h+='<div class="inst"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div><h2>'+tr(["Orthotimer \u2014 uw sensor","Orthotimer \u2014 your sensor"])+'</h2></div>';
h+='<p style="color:var(--soft);margin:8px 0">'+tr(["In uw op maat gemaakte orthese (binnenzool) zit een kleine sensor. Die sensor meet enkel de <strong>temperatuur</strong>: als de schoen aan uw voet zit, warmt hij op. Zo weten we wanneer u het schoeisel draagt.","Inside your custom orthopaedic insole there is a small sensor. This sensor measures only the <strong>temperature</strong>: when the shoe is on your foot, it warms up. This is how we know when you are wearing the footwear."])+'</p>';
h+='<div class="grid2" style="gap:8px;margin-top:8px">';
h+='<div style="background:var(--green-soft);border-radius:10px;padding:10px 12px"><b style="color:var(--green);font-size:13px">'+tr(["Wat hij w\u00e9l doet","What it DOES do"])+'</b><ul style="margin:6px 0 0;padding-left:16px;color:var(--soft);font-size:13.5px"><li>'+tr(["temperatuur meten","measure temperature"])+'</li><li>'+tr(["draagtijd registreren","record wear time"])+'</li></ul></div>';
h+='<div style="background:var(--red-soft);border-radius:10px;padding:10px 12px"><b style="color:var(--red);font-size:13px">'+tr(["Wat hij n\u00ed\u00e9t doet","What it does NOT do"])+'</b><ul style="margin:6px 0 0;padding-left:16px;color:var(--soft);font-size:13.5px"><li>'+tr(["geen GPS","no GPS"])+'</li><li>'+tr(["geen microfoon","no microphone"])+'</li><li>'+tr(["geen camera","no camera"])+'</li><li>'+tr(["geen locatie of geluid","no location or sound"])+'</li></ul></div>';
h+='</div>';
h+='<p class="muted" style="margin-top:8px">'+tr(["De sensor wordt elke 3 maanden door uw zorgteam uitgelezen en indien nodig vervangen.","Your care team reads the sensor every 3 months and replaces it if needed."])+'</p>';
h+='</div>';

/* MoveMonitor */
h+='<div class="card">';
h+='<div class="inst"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></div><h2>'+tr(["MoveMonitor","MoveMonitor"])+'</h2></div>';
h+='<p style="color:var(--soft);margin:8px 0">'+tr(["De McRoberts MoveMonitor is een kleine accelerometer (bewegingssensor) ongeveer zo groot als een luciferdoosje die u op uw onderrug draagt. U draagt hem gedurende <strong>1 volle week</strong>, bij de start van de studie.","The McRoberts MoveMonitor is a small accelerometer (movement sensor) about the size of a matchbox that you wear on your lower back. You wear it for <strong>1 full week</strong>, at the start of the study."])+'</p>';
h+='<div class="note warn" style="margin:8px 0"><span class="lab">'+tr(["Let op","Please note"])+'</span>'+tr(["De MoveMonitor is <strong>niet waterproof</strong>. Verwijder hem voor het douchen, zwemmen of andere contacten met water.","The MoveMonitor is <strong>not waterproof</strong>. Remove it before showering, swimming or any contact with water."])+'</div>';
h+='<p class="muted">'+tr(["Het toestel registreert uw stappen en hoe lang u staat, loopt, zit of ligt. Zo weten we hoe lang u per dag wakker bent, en dus hoe lang uw schoenen per dag aan horen te zijn.","The device records your steps and how long you stand, walk, sit or lie down. That tells us how long you are awake each day, and so how long your shoes should be on each day."])+'</p>';
h+='</div>';
h+='</div>'; /* end grid2 devices */

/* Pressure measurements */
h+='<div class="sh">'+tr(["Drukmetingen","Pressure measurements"])+'</div>';
h+='<div class="card" style="margin-bottom:14px"><p style="color:var(--soft);margin:0">'+tr(["Op het eerste en het tweede bezoek en op maand 6, 12 en 18 meten we de druk onder uw voet, in uw schoen. U stapt een paar minuten op uw gewone tempo met een dunne meetzool in uw schoen; dat doet geen pijn. Soms meet het studieteam meteen nog eens met een tweede toestel, om beide toestellen te vergelijken.","At the first and second visit and at months 6, 12 and 18 we measure the pressure under your foot, inside your shoe. You walk for a few minutes at your usual pace with a thin measuring insole in your shoe; it does not hurt. Sometimes the study team measures again with a second device, to compare the two devices."])+'</p></div>';

/* Visit schedule */
h+='<div class="sh">'+tr(["Planning van de bezoeken","Visit schedule"])+'</div>';
h+='<table class="tbl" style="margin-bottom:14px"><thead><tr><th>'+tr(["Bezoek","Visit"])+'</th><th>'+tr(["Wanneer","When"])+'</th><th>'+tr(["Wat gebeurt er","What happens"])+'</th></tr></thead><tbody>';
h+='<tr><td>'+tr(["Bezoek 1","Visit 1"])+'</td><td>'+tr(["start","start"])+'</td><td>'+tr(["Onderzoek van voeten en schoenen, drukmeting, vragenlijsten. U krijgt de activiteitenmonitor mee voor \u00e9\u00e9n week.","Foot and shoe check, pressure measurement, questionnaires. You take the activity monitor home for one week."])+'</td></tr>';
h+='<tr><td>'+tr(["Bezoek 2","Visit 2"])+'</td><td>'+tr(["2 tot 4 weken later","2 to 4 weeks later"])+'</td><td>'+tr(["U krijgt uw nieuwe zolen met de sensor; drukmeting met en zonder zool. U brengt de activiteitenmonitor terug.","You receive your new insoles with the sensor; pressure measurement with and without the insole. You return the activity monitor."])+'</td></tr>';
h+='<tr><td>'+tr(["Bezoek 3, 5, 7","Visits 3, 5, 7"])+'</td><td>'+tr(["maand 3, 9, 15","months 3, 9, 15"])+'</td><td>'+tr(["Sensor uitlezen, voeten en schoenen nakijken, vragenlijsten.","Read the sensor, check feet and shoes, questionnaires."])+'</td></tr>';
h+='<tr><td>'+tr(["Bezoek 4, 6","Visits 4, 6"])+'</td><td>'+tr(["maand 6, 12","months 6, 12"])+'</td><td>'+tr(["Zoals hierboven, plus een drukmeting.","As above, plus a pressure measurement."])+'</td></tr>';
h+='<tr><td>'+tr(["Bezoek 8","Visit 8"])+'</td><td>'+tr(["maand 18","month 18"])+'</td><td>'+tr(["Laatste bezoek, met drukmeting.","Last visit, with a pressure measurement."])+'</td></tr>';
h+='</tbody></table>';

/* Rights */
h+='<div class="sh">'+tr(["Uw rechten","Your rights"])+'</div>';
h+='<div class="grid2" style="margin-bottom:14px">';
h+='<div class="card"><b style="color:var(--pd)">'+tr(["Vrijwillige deelname","Voluntary participation"])+'</b><p style="color:var(--soft);margin:8px 0 0;font-size:14.5px">'+tr(["U kunt op elk ogenblik en zonder reden stoppen met het onderzoek. Uw medische zorg blijft in alle gevallen hetzelfde.","You may stop participating at any moment and for any reason. Your medical care remains the same in all cases."])+'</p></div>';
h+='<div class="card"><b style="color:var(--pd)">'+tr(["Uw gegevens","Your data"])+'</b><p style="color:var(--soft);margin:8px 0 0;font-size:14.5px">'+tr(["Uw gegevens worden gecodeerd en vertrouwelijk verwerkt, alleen voor dit onderzoek en volgens de GDPR. Wat u precies kunt inkijken of laten aanpassen, staat in het toestemmingsformulier.","Your data are coded and handled confidentially, only for this study and in line with the GDPR. What you can view or have corrected is set out in the consent form."])+'</p></div>';
h+='</div>';

/* FAQ */
h+='<div class="sh">'+tr(["Veelgestelde vragen","Frequently asked questions"])+'</div>';
var faqs=[
  [["Mag de sensor nat worden?","May the sensor get wet?"],["Ja, de sensor in uw zool kan tegen water. Alleen de activiteitenmonitor die u de eerste week draagt, mag niet nat worden: doe die uit voor u doucht of zwemt.","Yes, the sensor in your insole is waterproof. Only the activity monitor you wear in the first week must not get wet: take it off before you shower or swim."]],
  [["Wat als ik mijn schoenen een dag niet gedragen heb?","What if I did not wear my shoes for a day?"],["Draag ze de volgende dag gewoon weer; elke dag telt. Is dragen moeilijk, zeg het dan aan uw zorgteam: dan zoeken we samen een oplossing.","Just wear them again the next day; every day counts. If wearing them is difficult, tell your care team and we will look for a solution together."]],
  [["Kan de sensor zien waar ik ben?","Can the sensor see where I am?"],["Nee. De sensor meet alleen temperatuur en heeft geen GPS, geen microfoon en geen camera. De sensor weet niet waar u bent.","No. The sensor only measures temperature and has no GPS, no microphone, and no camera. The sensor does not know where you are."]],
  [["Wat als ik klachten heb aan mijn schoen of orthese?","What if I have complaints about my shoe or orthopaedic insole?"],["Neem zo snel mogelijk contact op met uw zorgteam. Wacht niet tot het volgende geplande bezoek als er iets scheelt aan uw schoeisel.","Contact your care team as soon as possible. Do not wait until the next scheduled visit if something is wrong with your footwear."]]
];
faqs.forEach(function(f){
  h+='<details style="background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden"><summary style="padding:14px 16px;cursor:pointer;font-weight:600;color:var(--pd);font-size:15px">'+tr(f[0])+'</summary><p style="margin:0;padding:0 16px 14px;color:var(--soft)">'+tr(f[1])+'</p></details>';
});

h+='<div class="note tip" style="margin-top:16px"><span class="lab">'+tr(["Vragen of ongerust?","Questions or concerns?"])+'</span>'+tr(["Aarzel niet om contact op te nemen met uw zorgteam bij de diabetische voetcliniek. Zij staan klaar om al uw vragen te beantwoorden.","Do not hesitate to contact your care team at the diabetic foot clinic. They are there to answer all your questions."])+'</div>';


return h;
};
window.addEventListener('message',function(e){if(e.data&&e.data.type==='px_lang'){setLang(e.data.lang);if(window.repaint)window.repaint();}});
if(window.self!==window.top){document.body.classList.add('embedded');}
boot();
</script>
