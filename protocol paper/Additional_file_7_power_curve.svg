  <text x="475" y="528" font-size="12" fill="#33475B" text-anchor="middle">Assumed 18-month recurrence under PARADISE</text>
  <text x="20" y="275" font-size="12" fill="#33475B" transform="rotate(-90 20 275)" text-anchor="middle">Power</text>
  <text x="40" y="534" font-size="11" fill="#5A6B7D">Because the trial is declared positive only if both co-primary endpoints are met, the probability of succeeding on both is lower than either curve</text>
  <text x="40" y="550" font-size="11" fill="#5A6B7D">alone — approximately 74% under the primary assumption if the endpoints are independent, and higher to the extent that they correlate.</text>
