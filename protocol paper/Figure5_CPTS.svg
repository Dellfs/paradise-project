<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="1020" height="540" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1B3A5C"/>
    </marker>
    <marker id="arT" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#0E7C86"/>
    </marker>
  </defs>

  <rect width="1020" height="540" fill="#FFFFFF"/>

  <!-- ============ column headings ============ -->
  <text x="30" y="34" font-size="13" font-weight="bold" fill="#1B3A5C" letter-spacing="1.2">DETERMINANTS</text>
  <text x="405" y="34" font-size="13" font-weight="bold" fill="#1B3A5C" letter-spacing="1.2">INTEGRATED LOAD</text>
  <text x="742" y="34" font-size="13" font-weight="bold" fill="#1B3A5C" letter-spacing="1.2">OUTCOME</text>
  <line x1="30" y1="44" x2="990" y2="44" stroke="#C8D3DE" stroke-width="1"/>

  <!-- ============ three determinant boxes ============ -->
  <!-- 1 pressure -->
  <rect x="30" y="72" width="300" height="86" rx="4" fill="#EAF1F7" stroke="#1B3A5C" stroke-width="1.6"/>
  <text x="46" y="96" font-size="14" font-weight="bold" fill="#1B3A5C">Plantar pressure</text>
  <text x="46" y="116" font-size="12" fill="#33475B">Region-specific in-shoe peak pressure</text>
  <text x="46" y="134" font-size="11.5" fill="#5A6B7D" font-style="italic">Novel pedar — baseline, 6, 12 months</text>
  <rect x="46" y="141" width="132" height="13" rx="2" fill="#0E7C86"/>
  <text x="52" y="151" font-size="9.5" fill="#FFFFFF" font-weight="bold">MODIFIED BY TRIAL ARM</text>

  <!-- 2 activity -->
  <rect x="30" y="176" width="300" height="86" rx="4" fill="#F4F6F8" stroke="#8FA3B5" stroke-width="1.6"/>
  <text x="46" y="200" font-size="14" font-weight="bold" fill="#1B3A5C">Weight-bearing activity</text>
  <text x="46" y="220" font-size="12" fill="#33475B">Step count and standing time</text>
  <text x="46" y="238" font-size="11.5" fill="#5A6B7D" font-style="italic">MoveMonitor — continuous</text>
  <rect x="46" y="245" width="104" height="13" rx="2" fill="#8FA3B5"/>
  <text x="52" y="255" font-size="9.5" fill="#FFFFFF" font-weight="bold">OBSERVED ONLY</text>

  <!-- 3 adherence -->
  <rect x="30" y="280" width="300" height="86" rx="4" fill="#EAF1F7" stroke="#1B3A5C" stroke-width="1.6"/>
  <text x="46" y="304" font-size="14" font-weight="bold" fill="#1B3A5C">Offloading adherence</text>
  <text x="46" y="324" font-size="12" fill="#33475B">Whether footwear was worn while loading</text>
  <text x="46" y="342" font-size="11.5" fill="#5A6B7D" font-style="italic">Orthotimer — continuous</text>
  <rect x="46" y="349" width="132" height="13" rx="2" fill="#0E7C86"/>
  <text x="52" y="359" font-size="9.5" fill="#FFFFFF" font-weight="bold">MODIFIED BY TRIAL ARM</text>

  <!-- arrows into CPTS -->
  <path d="M334,115 C372,115 372,205 404,215" stroke="#1B3A5C" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <path d="M334,219 L404,219" stroke="#8FA3B5" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <path d="M334,323 C372,323 372,231 404,223" stroke="#1B3A5C" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <!-- ============ CPTS node ============ -->
  <rect x="410" y="140" width="252" height="160" rx="5" fill="#1B3A5C"/>
  <text x="536" y="172" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Cumulative plantar</text>
  <text x="536" y="192" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">tissue stress</text>
  <line x1="440" y1="206" x2="632" y2="206" stroke="#4E6B87" stroke-width="1"/>
  <text x="536" y="232" font-size="12.5" fill="#CFE0EC" text-anchor="middle">∫ (pressure × activity)</text>
  <text x="536" y="252" font-size="12.5" fill="#CFE0EC" text-anchor="middle">partitioned by whether</text>
  <text x="536" y="270" font-size="12.5" fill="#CFE0EC" text-anchor="middle">offloading was worn</text>
  <text x="536" y="290" font-size="11" fill="#8FB0C9" text-anchor="middle" font-style="italic">time-varying covariate</text>

  <path d="M666,220 L738,220" stroke="#1B3A5C" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <!-- ============ outcome + dose-response plot ============ -->
  <rect x="744" y="72" width="246" height="86" rx="4" fill="#EAF1F7" stroke="#1B3A5C" stroke-width="1.6"/>
  <text x="760" y="96" font-size="14" font-weight="bold" fill="#1B3A5C">Ulcer recurrence</text>
  <text x="760" y="116" font-size="12" fill="#33475B">Time to first adjudicated ulcer</text>
  <text x="760" y="134" font-size="11.5" fill="#5A6B7D" font-style="italic">Blinded adjudication, 18 months</text>

  <!-- plot frame -->
  <rect x="744" y="176" width="246" height="190" rx="4" fill="#FFFFFF" stroke="#C8D3DE" stroke-width="1.2"/>
  <text x="867" y="196" font-size="11.5" font-weight="bold" fill="#1B3A5C" text-anchor="middle">Hypothesised dose–response</text>
  <line x1="782" y1="340" x2="962" y2="340" stroke="#33475B" stroke-width="1.3"/>
  <line x1="782" y1="340" x2="782" y2="212" stroke="#33475B" stroke-width="1.3"/>
  <path d="M782,332 C838,330 872,318 898,286 C920,258 936,236 962,226"
        stroke="#0E7C86" stroke-width="2.6" fill="none"/>
  <line x1="878" y1="212" x2="878" y2="340" stroke="#B04A3A" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="884" y="226" font-size="10" fill="#B04A3A">threshold?</text>
  <text x="867" y="358" font-size="10.5" fill="#33475B" text-anchor="middle">cumulative tissue stress →</text>
  <text x="770" y="278" font-size="10.5" fill="#33475B" text-anchor="middle" transform="rotate(-90 770 278)">hazard →</text>

  <!-- ============ footnote band ============ -->
  <line x1="30" y1="404" x2="990" y2="404" stroke="#C8D3DE" stroke-width="1"/>
  <text x="30" y="428" font-size="12" font-weight="bold" fill="#1B3A5C">Why this has not been estimated before</text>
  <text x="30" y="450" font-size="11.5" fill="#33475B">Current guidance approximates this relationship with two fixed thresholds — in-shoe peak pressure &lt;200 kPa and adherence &gt;80% — neither derived from outcome data.</text>
  <text x="30" y="470" font-size="11.5" fill="#33475B">Prior cohorts assembled to measure cumulative plantar tissue stress achieved complete follow-up data for 8% and 0% of participants respectively (n = 25 combined);</text>
  <text x="30" y="490" font-size="11.5" fill="#33475B">the strongest evidence linking it to future ulceration remains observational and 12 months long. PARADISE records all three determinants concurrently in 144</text>
  <text x="30" y="510" font-size="11.5" fill="#33475B">participants over 18 months, within a design that randomly manipulates two of them. This analysis is exploratory and restricted to adequate sensor coverage.</text>
</svg>
