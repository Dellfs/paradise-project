  <text x="536.375" y="376" font-size="9.8" fill="#33475B" text-anchor="middle">MoveMonitor 7 d</text>
  <text x="613.625" y="376" font-size="9.5" fill="#5A6B7D" font-style="italic">Read-out and battery replacement every three months · wear-time data withheld in usual care</text>
