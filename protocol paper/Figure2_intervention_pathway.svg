  <text x="305.875" y="449" font-size="10" fill="#33475B">Ulcer surveillance at every visit (PEDIS / WIfI) — blinded adjudication</text>
  <rect x="685.875" y="466" width="90" height="34" rx="3" fill="#F7E9E5" stroke="#B04A3A" stroke-width="1.6"/>
  <text x="730.875" y="480" font-size="10" fill="#B04A3A" font-weight="bold" text-anchor="middle">Co-primary 2</text>
  <text x="730.875" y="492" font-size="9.8" fill="#33475B" text-anchor="middle">adherence</text>
  <rect x="880.375" y="466" width="90" height="34" rx="3" fill="#F7E9E5" stroke="#B04A3A" stroke-width="1.6"/>
  <text x="925.375" y="480" font-size="10" fill="#B04A3A" font-weight="bold" text-anchor="middle">Co-primary 1</text>
  <text x="925.375" y="492" font-size="9.8" fill="#33475B" text-anchor="middle">recurrence</text>
  <line x1="30" y1="530" x2="974" y2="530" stroke="#C8D3DE" stroke-width="1"/>
  <text x="30" y="552" font-size="12" fill="#1B3A5C" font-weight="bold">Reading this figure</text>
  <text x="30" y="574" font-size="11" fill="#33475B">Usual care comprises three-monthly podiatric review, protective footwear with a custom-made foot orthosis, and foot-care education. Its degree of offloading is not quantified</text>
  <text x="30" y="592" font-size="11" fill="#33475B">and is not disclosed to the treating team or the participant. Adherence sensors are worn in both arms because the between-arm comparison of adherence is a co-primary endpoint,</text>
  <text x="30" y="610" font-size="11" fill="#33475B">but wear-time data are neither shown to nor discussed with usual-care participants or their clinicians, so the behavioural component is not delivered in that arm.</text>
  <text x="30" y="628" font-size="11" fill="#33475B">The trial is declared positive only if both co-primary endpoints are met. CMFO, custom-made foot orthosis; SEBIA, Structured Education and Behavioural Intervention Approach.</text>
  </svg>