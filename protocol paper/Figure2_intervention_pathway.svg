  <text x="44" y="436" font-size="12" fill="#1B3A5C" font-weight="bold">Co-primary</text>
  <text x="44" y="451" font-size="12" fill="#1B3A5C" font-weight="bold">outcomes</text>
  <rect x="44" y="486" width="67.8" height="14" rx="2" fill="#8FA3B5"/>
  <text x="50" y="496.5" font-size="9.5" fill="#FFFFFF" font-weight="bold">BOTH ARMS</text>
