  <line x1="336" y1="330" x2="211.299" y2="181.387" stroke="#C8D3DE" stroke-width="1"/>
  <text x="340" y="307" font-size="9.5" fill="#5A6B7D">1</text>
  <text x="340" y="267" font-size="9.5" fill="#5A6B7D">2</text>
  <text x="340" y="227" font-size="9.5" fill="#5A6B7D">3</text>
  <text x="340" y="187" font-size="9.5" fill="#5A6B7D">4</text>
  <text x="340" y="147" font-size="9.5" fill="#5A6B7D">5</text>
  <polygon points="336,216 434.989,212.029 487.66,303.258 434.727,387 374.99,437.125 283.329,474.713 202.632,407 184.34,303.258 211.299,181.387" fill="#0E7C86" fill-opacity="0.22" stroke="#0E7C86" stroke-width="2.4"/>
  <circle cx="336" cy="216" r="5" fill="#0E7C86" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="434.989" cy="212.029" r="5" fill="#0E7C86" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="487.66" cy="303.258" r="5" fill="#0E7C86" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="434.727" cy="387" r="5" fill="#0E7C86" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="374.99" cy="437.125" r="5" fill="#0E7C86" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="283.329" cy="474.713" r="5" fill="#0E7C86" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="202.632" cy="407" r="5" fill="#0E7C86" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="184.34" cy="303.258" r="5" fill="#0E7C86" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="211.299" cy="181.387" r="5" fill="#0E7C86" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="336" y="112" font-size="11.5" fill="#1B3A5C" font-weight="bold" text-anchor="middle">Eligibility</text>
  <text x="336" y="126" font-size="11.5" fill="#0E7C86" font-weight="bold" text-anchor="middle">3</text>
  <text x="473.557" y="162.066" font-size="11.5" fill="#1B3A5C" font-weight="bold">Recruitment</text>
  <text x="473.557" y="176.066" font-size="11.5" fill="#0E7C86" font-weight="bold">4</text>
  <text x="546.749" y="296.839" font-size="11.5" fill="#1B3A5C" font-weight="bold">Setting</text>
  <text x="546.749" y="310.839" font-size="11.5" fill="#0E7C86" font-weight="bold">4</text>
  <text x="521.329" y="450" font-size="11.5" fill="#1B3A5C" font-weight="bold">Organisation</text>
  <text x="521.329" y="464" font-size="11.5" fill="#0E7C86" font-weight="bold">3</text>
  <text x="409.192" y="544.094" font-size="11.5" fill="#1B3A5C" font-weight="bold">Flexibility: delivery</text>
  <text x="409.192" y="558.094" font-size="11.5" fill="#0E7C86" font-weight="bold">3</text>
  <text x="262.808" y="544.094" font-size="11.5" fill="#1B3A5C" font-weight="bold" text-anchor="end">Flexibility: adherence</text>
  <text x="262.808" y="558.094" font-size="11.5" fill="#0E7C86" font-weight="bold" text-anchor="end">4</text>
  <text x="150.671" y="450" font-size="11.5" fill="#1B3A5C" font-weight="bold" text-anchor="end">Follow-up</text>
  <text x="150.671" y="464" font-size="11.5" fill="#0E7C86" font-weight="bold" text-anchor="end">4</text>
  <text x="125.251" y="296.839" font-size="11.5" fill="#1B3A5C" font-weight="bold" text-anchor="end">Primary outcome</text>
  <text x="125.251" y="310.839" font-size="11.5" fill="#0E7C86" font-weight="bold" text-anchor="end">4</text>
  <text x="198.443" y="162.066" font-size="11.5" fill="#1B3A5C" font-weight="bold" text-anchor="end">Primary analysis</text>
  <text x="198.443" y="176.066" font-size="11.5" fill="#0E7C86" font-weight="bold" text-anchor="end">5</text>
  <line x1="674" y1="86" x2="674" y2="596" stroke="#C8D3DE" stroke-width="1"/>
  <text x="690" y="108" font-size="11" fill="#1B3A5C" font-weight="bold" letter-spacing="1.1">DOMAIN RATINGS AND BASIS</text>
  <rect x="690" y="123" width="22" height="18" rx="3" fill="#0E7C86"/>
  <text x="701" y="136" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text>
  <text x="722" y="136" font-size="11.5" fill="#1B3A5C" font-weight="bold">Eligibility</text>
  <text x="722" y="151" font-size="10.2" fill="#33475B">IWGDF category 3 only; vascular, renal and mobility exclusions</text>
  <rect x="690" y="167" width="22" height="18" rx="3" fill="#0E7C86"/>
  <text x="701" y="180" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle">4</text>
  <text x="722" y="180" font-size="11.5" fill="#1B3A5C" font-weight="bold">Recruitment</text>
  <text x="722" y="195" font-size="10.2" fill="#33475B">From routine clinic schedules and referrals; no special drive</text>
  <rect x="690" y="211" width="22" height="18" rx="3" fill="#0E7C86"/>
  <text x="701" y="224" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle">4</text>
  <text x="722" y="224" font-size="11.5" fill="#1B3A5C" font-weight="bold">Setting</text>
  <text x="722" y="239" font-size="10.2" fill="#33475B">Six recognised Belgian diabetic foot clinics, academic and not</text>
  <rect x="690" y="255" width="22" height="18" rx="3" fill="#0E7C86"/>
  <text x="701" y="268" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text>
  <text x="722" y="268" font-size="11.5" fill="#1B3A5C" font-weight="bold">Organisation</text>
  <text x="722" y="283" font-size="10.2" fill="#33475B">Existing clinical staff, but MI training and pedar hardware added</text>
  <rect x="690" y="299" width="22" height="18" rx="3" fill="#0E7C86"/>
  <text x="701" y="312" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text>
  <text x="722" y="312" font-size="11.5" fill="#1B3A5C" font-weight="bold">Flexibility: delivery</text>
  <text x="722" y="327" font-size="10.2" fill="#33475B">Five-step SEBIA protocol; individually tailored from Step 3</text>
  <rect x="690" y="343" width="22" height="18" rx="3" fill="#0E7C86"/>
  <text x="701" y="356" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle">4</text>
  <text x="722" y="356" font-size="11.5" fill="#1B3A5C" font-weight="bold">Flexibility: adherence</text>
  <text x="722" y="371" font-size="10.2" fill="#33475B">No intensity modification; concomitant care unrestricted</text>
  <rect x="690" y="387" width="22" height="18" rx="3" fill="#0E7C86"/>
  <text x="701" y="400" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle">4</text>
  <text x="722" y="400" font-size="11.5" fill="#1B3A5C" font-weight="bold">Follow-up</text>
  <text x="722" y="415" font-size="10.2" fill="#33475B">Three-monthly, as in routine category 3 review; extra measures</text>
  <rect x="690" y="431" width="22" height="18" rx="3" fill="#0E7C86"/>
  <text x="701" y="444" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle">4</text>
  <text x="722" y="444" font-size="11.5" fill="#1B3A5C" font-weight="bold">Primary outcome</text>
  <text x="722" y="459" font-size="10.2" fill="#33475B">Ulcer recurrence, directly patient-relevant; adjudication blinded</text>
  <rect x="690" y="475" width="22" height="18" rx="3" fill="#0E7C86"/>
  <text x="701" y="488" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle">5</text>
  <text x="722" y="488" font-size="11.5" fill="#1B3A5C" font-weight="bold">Primary analysis</text>
  <text x="722" y="503" font-size="10.2" fill="#33475B">Intention-to-treat, all randomised participants retained</text>
  <line x1="30" y1="614" x2="990" y2="614" stroke="#C8D3DE" stroke-width="1"/>
  <text x="30" y="636" font-size="11" fill="#33475B">Ratings were assigned by the trial team against the design as specified in this protocol. PARADISE is pragmatic in whom it recruits, where it is delivered and how</text>
  <text x="30" y="654" font-size="11" fill="#33475B">it is analysed, and more explanatory in organisation and flexibility of delivery: the trial adds motivational-interviewing training and in-shoe pressure measurement to</text>
  <text x="30" y="672" font-size="11" fill="#33475B">routine practice, and delivers SEBIA as a five-step protocol rather than at clinician discretion. This is the trade-off a trial of an as-yet unreimbursed service must make.</text>
  </svg>