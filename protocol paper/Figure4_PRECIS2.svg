  <text x="30" y="30" font-size="14" fill="#1B3A5C" font-weight="bold">Figure 4. PRECIS-2 wheel for PARADISE</text>
  <text x="30" y="49" font-size="11" fill="#5A6B7D">Position on the explanatory–pragmatic continuum. 1 = very explanatory, 5 = very pragmatic.</text>
