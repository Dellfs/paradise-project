  :root{
    --bg:#04182A; --grond:#072138; --tegel:#0A2A44; --tegel2:#113A57;
    --rand:#215B84; --ink:#F2F8FC; --gedempt:#8FB6D0;
    --navy:#00407A; --mid:#1D8DB0; --licht:#52BDEC; --oranje:#FF7A00;
    --groen:#2E9E6B; --groen2:#4FC08D;
    --font-h:'DM Serif Display',Georgia,serif;
    --font-b:'DM Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#000;overflow:hidden}
  body{font-family:var(--font-b);color:var(--ink);
       -webkit-user-select:none;user-select:none;touch-action:none}
  body.geenmuis{cursor:none}
  #doek{position:fixed;inset:0;display:grid;place-items:center;background:#000}
  svg{width:100%;height:100%;display:block}

  /* de tekstklassen gelden ook binnen de SVG */
  .kop{font-family:var(--font-h);font-weight:400}
  .tekst{font-family:var(--font-b);font-weight:500}
  .getal{font-family:var(--font-b);font-weight:700;
         font-variant-numeric:tabular-nums}
  .label{font-family:var(--font-b);font-weight:500;letter-spacing:.16em}

  #balk{position:fixed;left:0;top:0;height:2px;background:var(--licht);
        width:0;opacity:.55}
  /* de bediening dooft uit: op een stand hoort er niets in beeld te staan
     wat het publiek niet aangaat */
  #hint{position:fixed;right:26px;bottom:24px;font-size:13px;color:var(--gedempt);
        opacity:0;letter-spacing:.08em;pointer-events:none;
        transition:opacity .5s ease}
  body.toonhint #hint{opacity:.5}
  #pauze{position:fixed;inset:0;display:none;place-items:center;
         background:rgba(2,10,18,.55);font-size:26px;letter-spacing:.26em;
         font-weight:700}
  body.gepauzeerd #pauze{display:grid}

  /* Eén klik zet de film op volledig scherm en houdt het scherm wakker.
     Allebei mag alleen na een gebaar van de gebruiker; daarom dit paneel. */
  #start{position:fixed;inset:0;display:grid;place-items:center;
         background:rgba(2,9,17,.86);backdrop-filter:blur(7px);z-index:9;
         transition:opacity .5s ease}
  #start.weg{opacity:0;pointer-events:none}
  #start .doos{text-align:center;max-width:640px;padding:0 28px}
  #start h1{font-family:var(--font-h);font-weight:400;font-size:52px;
            margin:0 0 10px;letter-spacing:-.01em}
  #start p{margin:0 0 30px;color:var(--gedempt);font-size:19px;line-height:1.5}
  #start button{font-family:var(--font-b);font-weight:700;font-size:18px;
                letter-spacing:.04em;color:#04182A;background:var(--licht);
                border:0;border-radius:999px;padding:16px 38px;cursor:pointer}
  #start button:hover{background:#7FD0F2}
  #start small{display:block;margin-top:26px;color:#6B93AE;font-size:13px;
               letter-spacing:.06em}
</style>
</head>

   Waarom in de browser en niet in PowerPoint: hier kan een ledemaat om zijn
   eigen scharnier draaien, kan een kleur per beeld herberekend worden, en
   loopt alles op de beeldsnelheid van het scherm in plaats van in de
   sprongen van een diaovergang. Dat is het verschil tussen een
   diavoorstelling met overgangen en een film.

   Voor de stand: één bestand, geen netwerk nodig, loopt eindeloos door,
   houdt het scherm wakker en laat zich met een presentatieklikker bedienen.
   ===================================================================== */

/* breedte gedeeld door hoogte, om de logo's op maat te kunnen zetten */
const V_PARADISE = 2048 / 782, V_KUL = 1084 / 309;

/* Van het AZ Groeninge-bestand is alleen het middenstuk nodig; de witte rand
   eromheen wordt in de SVG weggesneden in plaats van in het bestand, zodat
   het bronbestand ongemoeid blijft. */
const AZG = {x0:.117, x1:.933, y0:.183, y1:.884};
const AZG_V = (AZG.x1 - AZG.x0) * 1200 / ((AZG.y1 - AZG.y0) * 628);
let azgTeller = 0;
function azgroeninge(ouder, x, y, hoogte){
  const breedte = hoogte * AZG_V;
  const id = 'azg' + (azgTeller++);
  const cp = el('clipPath', {id}, defs);
  el('rect', {x, y, width:breedte, height:hoogte}, cp);
  const W = breedte / (AZG.x1 - AZG.x0), Hh = hoogte / (AZG.y1 - AZG.y0);
  const g = groep({'clip-path':`url(#${id})`}, ouder);
  el('image', {href:LOGO_AZG, x:x - AZG.x0 * W, y:y - AZG.y0 * Hh,
               width:W, height:Hh}, g);
  return breedte;
}

/* een wit plaatje onder een logo dat voor wit papier gemaakt is */
function plaatje(ouder, x, y, w, h){
  el('rect', {x, y, width:w, height:h, rx:10, fill:'#FFFFFF'}, ouder);
}

const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('svg');
const B = 1920, H = 1080, GROND = 872;
let NU = 0;                      /* wereldklok: ademen en knipperen lopen door */

/* ------------------------------------------------------------ gereedschap */
const el = (naam, attr = {}, ouder = svg) => {
  const n = document.createElementNS(NS, naam);
  for (const k in attr) n.setAttribute(k, attr[k]);
  ouder.appendChild(n);
  return n;
};
const groep = (attr = {}, ouder = svg) => el('g', attr, ouder);
const klem = (v, a, b) => Math.max(a, Math.min(b, v));
const meng = (a, b, t) => a + (b - a) * t;

/* Versnellingscurves. Lineair bewegen oogt mechanisch; alles wat leeft komt
   op gang en loopt uit. */
const soepel   = t => t * t * (3 - 2 * t);
const uitloop  = t => 1 - Math.pow(1 - t, 3);
const inloop   = t => t * t * t;
const veer     = t => t >= 1 ? 1 :
  1 - Math.pow(2, -10 * t) * Math.cos((t * 10 - .75) * (2 * Math.PI) / 3);
/* deel van een scène, met eigen begin, duur en curve */
const stuk = (u, van, tot, curve = soepel) =>
  curve(klem((u - van) / (tot - van), 0, 1));

/* ------------------------------------------------------------------ licht
   Eén lichtrichting voor de hele film: van linksboven. Elke vorm krijgt een
   verloop van licht naar donker in plaats van één vlakke kleur. Dat ene ding
   haalt het meeste weg van de blokjes-look — een vlak gevulde vorm oogt als
   een sticker, een vorm met licht erop oogt als iets dat er staat. */
const defs = el('defs');
const gradCache = {};
let kransTeller = 0;
function verlicht(basis, kracht = .26){
  const sleutel = basis + '|' + kracht;
  if (gradCache[sleutel]) return gradCache[sleutel];
  const id = 'v' + Object.keys(gradCache).length;
  const g = el('linearGradient', {id, x1:0, y1:0, x2:.85, y2:1}, defs);
  el('stop', {offset:0, 'stop-color':tint(basis, kracht)}, g);
  el('stop', {offset:.55, 'stop-color':basis}, g);
  el('stop', {offset:1, 'stop-color':tint(basis, -kracht * 1.15)}, g);
  return gradCache[sleutel] = `url(#${id})`;
}
function tint(hex, f){
  const n = [1, 3, 5].map(i => parseInt(hex.substr(i, 2), 16));
  const uit = n.map(c => klem(Math.round(f > 0 ? c + (255 - c) * f : c * (1 + f)), 0, 255));
  return '#' + uit.map(c => c.toString(16).padStart(2, '0')).join('');
}

const kleur = (a, b, t) => {
  const h = s => [1, 3, 5].map(i => parseInt(s.substr(i, 2), 16));
  const [r1, g1, b1] = h(a), [r2, g2, b2] = h(b);
  return `rgb(${Math.round(meng(r1, r2, t))},${Math.round(meng(g1, g2, t))},${Math.round(meng(b1, b2, t))})`;
};

const schaduwGrad = el('radialGradient', {id:'schaduw'}, defs);
el('stop', {offset:0, 'stop-color':'#000', 'stop-opacity':.62}, schaduwGrad);

/* ------------------------------------------------------- het voetprofiel */
/* Mediale en laterale rand van een rechtervoet, van hiel (0) naar teen (1).
   Dezelfde tabel als in de dia's, zodat drukmat, meetzool en voetafdruk
   allemaal dezelfde vorm hebben. */
const PROFIEL = [
  [0,.40,.60],[.03,.33,.67],[.08,.29,.71],[.15,.28,.72],[.24,.29,.73],
  [.32,.33,.74],[.40,.37,.75],[.48,.36,.77],[.55,.31,.79],[.62,.24,.81],
  [.69,.19,.82],[.75,.17,.81],[.81,.17,.78],[.86,.18,.74],[.90,.19,.70],
  [.94,.20,.64],[.97,.21,.58],[1,.23,.50]];
function rand(t){
  if (t <= 0) return [PROFIEL[0][1], PROFIEL[0][2]];
  if (t >= 1) return [PROFIEL[17][1], PROFIEL[17][2]];
  for (let i = 0; i < PROFIEL.length - 1; i++){
    const [t0,l0,r0] = PROFIEL[i], [t1,l1,r1] = PROFIEL[i+1];
    if (t >= t0 && t <= t1){
      const f = (t - t0) / (t1 - t0);
      return [meng(l0,l1,f), meng(r0,r1,f)];
    }
  }
  return [PROFIEL[17][1], PROFIEL[17][2]];
}
/* De voet als één gesloten pad in plaats van een stapel vormen: dit is wat
   in PowerPoint niet kon en waardoor de voet daar nooit een voet werd. */
function voetPad(x, y, w, h, n = 60){
  const li = [], la = [];
  for (let i = 0; i <= n; i++){
    const t = i / n, [a, b] = rand(t);
    li.push([x + a * w, y + h - t * h]);
    la.push([x + b * w, y + h - t * h]);
  }
  const punten = la.concat(li.reverse());
  let d = `M ${punten[0][0].toFixed(1)} ${punten[0][1].toFixed(1)}`;
  for (let i = 1; i < punten.length; i++){
    const p = punten[i], q = punten[i - 1];
    d += ` Q ${q[0].toFixed(1)} ${q[1].toFixed(1)} ${((p[0]+q[0])/2).toFixed(1)} ${((p[1]+q[1])/2).toFixed(1)}`;
  }
  return d + ' Z';
}

const BAND = [[0,'#051D33'],[.16,'#0D3A63'],[.32,'#1D8DB0'],[.48,'#52BDEC'],

/* De volle breedte van de kleurenschaal komt overeen met 400 kPa. De grens
   van 200 kPa ligt dus precies op de helft — dat is meteen af te lezen. */
const SCHAAL_MAX = 400;
function bandkleur(v){
  v = klem(v, 0, 1);
  for (let i = 0; i < BAND.length - 1; i++){
    const [a, ca] = BAND[i], [b, cb] = BAND[i+1];
    if (v >= a && v <= b) return kleur(ca, cb, b === a ? 0 : (v - a) / (b - a));
  }
  return BAND[BAND.length - 1][1];
}
const veld = (h, x, y) => h.reduce((s, [hx, hy, amp, sig]) =>
  s + amp * Math.exp(-(((x-hx)**2 + (y-hy)**2)) / (2 * sig * sig)), 0);

/* Hoeveel radialen loopcyclus hoort bij een afgelegde afstand. Zonder deze
   koppeling loopt de pas los van de verplaatsing en schaatsen de voeten over
   de grond — dat is wat "niet smooth" er vooral uit deed zien. */
const STAP = 34;                                   /* paslengte in figuureenheden */
const loopFase = (afstand, sc) => afstand * 2 * Math.PI / (STAP * sc);

function poseer(f, x, y, sc, opties = {}){
  const {pas = 0, zwaai = 14, hop = 0, mond = 'lach', kijk = 0} = opties;
  const loopt = zwaai > 1;
  const tijd = NU;
  /* het lichaam staat hoog midden in de pas en zakt bij elke voetplaatsing */
  const bob = loopt ? (.5 - .5 * Math.cos(pas * 2)) * 3.2 : Math.sin(tijd * 1.6) * .7;
  const sq = loopt ? 1 + Math.cos(pas * 2) * .012 : 1;
  /* wie loopt, helt licht voorover; stilstaan is loodrecht */
  const kanteling = (opties.kanteling !== undefined ? opties.kanteling
                    : (loopt ? 2.6 : 0)) + (loopt ? Math.sin(pas) * .7 : 0);
  f.g.setAttribute('transform',
    `translate(${x} ${y - hop - bob}) scale(${sc * (2 - sq)} ${sc * sq}) rotate(${kanteling.toFixed(2)} 50 92)`);

  /* de schaduw blijft op de grond liggen en verliest scherpte bij het springen */
  const luchtig = klem(hop / 90, 0, 1);
  f.schaduw.setAttribute('transform',
    `translate(${(x + 50 * sc).toFixed(1)} ${(y + 126 * sc).toFixed(1)}) scale(${(sc * (1 + luchtig * .45)).toFixed(3)} ${(sc * (1 - luchtig * .25)).toFixed(3)})`);
  f.schaduw.setAttribute('opacity', (meng(.92, .3, luchtig) * (opties.schaduw ?? 1)).toFixed(2));

  const zet = (k, hoek) => k.g.setAttribute('transform', `rotate(${hoek} ${k.x} ${k.y})`);

  /* De loopcyclus. De heup zwaait, de knie buigt alleen naar achter en het
     meest tijdens het doorzwaaien, en de voet draait terug zodat hij vlak
     op de grond komt in plaats van met de punt vooruit. Een been kan ook
     handmatig gezet worden, voor springen en stilstaan. */
  for (const [naam, fase] of [['beenL', pas], ['beenR', pas + Math.PI]]){
    const k = f.d[naam];
    const eigen = opties[naam];
    if (eigen !== undefined){
      zet(k, eigen); zet(k.onder, Math.max(0, -eigen * .9)); zet(k.eind, 0);
      continue;
    }
    const heup = Math.sin(fase) * zwaai * 1.5;
    const knie = (.5 - .5 * Math.cos(fase + 1.1)) * zwaai * 2.4;
    const enkel = -heup * .45 - knie * .5;
    zet(k, heup); zet(k.onder, knie); zet(k.eind, enkel);
  }
  for (const [naam, eigen] of [['armL', opties.armL], ['armR', opties.armR]]){
    const k = f.d[naam];
    if (eigen !== undefined){ zet(k, eigen); zet(k.onder, 14); continue; }
    /* de armen zwaaien tegen de benen in, met een altijd licht gebogen elleboog */
    const teken = naam === 'armL' ? 1 : -1;
    zet(k, Math.sin(pas) * zwaai * -.85 * teken);
    zet(k.onder, 10 + (.5 - .5 * Math.cos(pas + .6)) * zwaai * .7);
  }

  const na = Math.sin(pas - .9) * (loopt ? 2.4 : 0);
  f.d.kop.setAttribute('transform', `rotate(${kijk + na} 50 34)`);
  if (f.d.vlechtL){
    const sl = Math.sin(pas - 1.2) * (loopt ? 10 : 0) + Math.sin(tijd * 1.1) * 2;
    zet(f.d.vlechtL, sl); zet(f.d.vlechtR, sl);
  }
  const fase = (tijd * .62 + f.knip) % 1;
  const dicht = fase > .965 ? 1 - Math.abs(fase - .9825) / .0175 : 0;
  f.d.ogen.forEach(o => o.g.setAttribute('transform',
    `translate(0 ${27 * dicht * .9}) scale(1 ${1 - dicht * .9})`));
  const my = f.w.mondY;
  f.d.mond.setAttribute('d', mond === 'open'
    ? `M44 ${my + .5} a6 6 0 0 0 12 0 a6 6 0 0 0 -12 0 Z`
    : `M43.5 ${my} q6.5 7 13 0 Z`);
}

/* ================================================================ decor */
/* Twee werelden. Buiten is het zondagnamiddag: diep blauw dat naar de horizon
   toe warm wordt. Binnen, waar gemeten wordt, blijft alles koel en donker.
   Dat verschil draagt het verhaal én maakt het kijken de moeite waard; één
   egale donkerblauwe grond over de hele film was het saaiste eraan. */
let gradTeller = 0;
function lucht(ouder, soort = 'lab'){
  const g = groep({}, ouder);
  const id = 'sky' + (gradTeller++);
  /* userSpaceOnUse: het verloop hangt aan de hoogte van het doek, niet aan
     de rechthoek. Daardoor mag de rechthoek ruim buiten beeld doorlopen
     zonder dat de horizon verschuift. */
  const lg = el('linearGradient', {id, gradientUnits:'userSpaceOnUse',
                                   x1:0, y1:0, x2:0, y2:H}, g);
  const stops = soort === 'avond'
    ? [[0,'#0A1E3C'],[.42,'#1D4E7A'],[.74,'#C96A4E'],[1,'#F0A45C']]
    : [[0,'#020C17'],[.62,'#08223A'],[1,'#0E3050']];
  stops.forEach(([o, c]) => el('stop', {offset:o, 'stop-color':c}, lg));
  el('rect', {x:-1400, y:-700, width:B + 2800, height:H + 1400,
              fill:`url(#${id})`}, g);
  if (soort === 'avond'){
    el('circle', {cx:1500, cy:GROND - 70, r:78, fill:'#FFD9A0', opacity:.9}, g);
    el('circle', {cx:1500, cy:GROND - 70, r:150, fill:'#FFC27A', opacity:.16}, g);
  }
  return g;
}

/* Een verre heuvelrug tussen de lucht en de bomen. Twee dieptelagen waren te
   weinig: alles stond op dezelfde afstand en daardoor plat. */
function heuvels(ouder, soort = 'avond'){
  const g = groep({}, ouder);
  const kl = soort === 'avond' ? '#3A3E6B' : '#0A2C49';
  el('path', {d:`M-1500 ${GROND + 8} L-1500 ${GROND - 96} Q80 ${GROND - 208} 430 ${GROND - 118}` +
                ` Q700 ${GROND - 44} 1000 ${GROND - 142} Q1320 ${GROND - 246} 1620 ${GROND - 126}` +
                ` Q1840 ${GROND - 62} 3400 ${GROND - 152} L3400 ${GROND + 8} Z`,
              fill:kl, opacity:.7}, g);
  return g;
}

/* Nevel op de horizon. Het oog leest een lichte band op de grondlijn als
   afstand; zonder die band plakken de verste bomen tegen de voorste. */
function nevel(ouder, soort = 'avond'){
  const id = 'nevel' + (gradTeller++);
  const lg = el('linearGradient', {id, x1:0, y1:0, x2:0, y2:1}, defs);
  const c = soort === 'avond' ? '#F0A45C' : '#1D8DB0';
  el('stop', {offset:0, 'stop-color':c, 'stop-opacity':0}, lg);
  el('stop', {offset:1, 'stop-color':c, 'stop-opacity':soort === 'avond' ? .3 : .12}, lg);
  return el('rect', {x:-1400, y:GROND - 230, width:B + 2800, height:230,
                     fill:`url(#${id})`}, ouder);
}

function boom(ouder, x, s, soort = 'lab', voet = GROND){
  const g = groep({transform:`translate(${x} ${voet}) scale(${s})`}, ouder);
  const [stam, k1, k2, k3] = soort === 'avond'
    ? ['#2A2036', '#123A2E', '#18513C', '#0E2F26']
    : ['#1B4A72', '#10395C', '#164A74', '#12406A'];
  el('path', {d:'M-11 0 L-6 -150 L6 -150 L11 0 Z', fill:stam}, g);
  el('path', {d:'M-6 -104 q-26 -12 -34 -34', fill:'none', stroke:stam,
              'stroke-width':8, 'stroke-linecap':'round'}, g);
  el('circle', {cx:-38, cy:-176, r:52, fill:k1}, g);
  el('circle', {cx:22, cy:-196, r:60, fill:k2}, g);
  el('circle', {cx:-6, cy:-146, r:50, fill:k3}, g);
  return g;
}

function grasveld(ouder, soort = 'lab'){
  const g = groep({}, ouder);
  const [vlak, rand_, pluk] = soort === 'avond'
    ? ['#11382C', '#F0A45C', '#1A5340'] : ['#0A2A44', '#2A6C9A', '#17567F'];
  el('rect', {x:-1500, y:GROND, width:B + 3000, height:H - GROND + 700, fill:vlak}, g);
  el('rect', {x:-1500, y:GROND, width:B + 3000, height:5, fill:rand_, opacity:.8}, g);
  /* echte grassprietjes in plaats van vinkjes: drie halmen per pol */
  for (let i = 0; i < 66; i++){
    const x = -1180 + i * 66 + (i * 53 % 41), h = 18 + (i * 37 % 16);
    let d = '';
    for (const [dx, f] of [[-7,.72],[0,1],[7,.8]])
      d += `M${x+dx} ${GROND+30} q${dx*.6} ${-h*f*.6} ${dx*1.5} ${-h*f} `;
    el('path', {d, fill:'none', stroke:pluk, 'stroke-width':4,
                'stroke-linecap':'round', opacity:.85}, g);
  }
  return g;
}

/* Vogels in de avondlucht. Vijf paden van drie streken; ze klapperen en
   drijven door. Beweging in de lucht maakt een buitenbeeld levend. */
function vogels(ouder){
  const g = groep({opacity:.6}, ouder), v = [];
  for (let i = 0; i < 5; i++){
    const p = el('path', {d:'', fill:'none', stroke:'#16283C',
                          'stroke-width':2.8, 'stroke-linecap':'round'}, g);
    v.push({p, x:260 + i * 300, y:150 + (i % 3) * 58, s:.55 + (i % 3) * .24, f:i * 1.37});
  }
  return {update(t){
    v.forEach(o => {
      const w = -7 - Math.sin(t * 4.2 + o.f) * 4.5;
      o.p.setAttribute('d', `M-12 0 q12 ${w.toFixed(1)} 12 0 q0 ${w.toFixed(1)} 12 0`);
      const x = ((o.x - t * 27) % (B + 420) + B + 420) % (B + 420) - 210;
      o.p.setAttribute('transform',
        `translate(${x.toFixed(1)} ${(o.y + Math.sin(t * .7 + o.f) * 10).toFixed(1)}) scale(${o.s})`);
    });
  }};
}

/* Stofjes in het licht van de meetruimte. Hetzelfde doel als de vogels
   buiten: één laag die traag beweegt haalt de stilstand uit een diagram. */
function stofjes(ouder, n = 30){
  const g = groep({}, ouder), p = [];
  for (let i = 0; i < n; i++){
    p.push({c:el('circle', {r:1.4 + (i * 13 % 7) * .45, fill:'#8FD6F5'}, g),
            x:(i * 167) % B, y:(i * 97) % H, v:-7 - (i % 5) * 4, f:(i * 31 % 100) / 100});
  }
  return {update(t){
    p.forEach(o => {
      o.c.setAttribute('cx', (o.x + Math.sin(t * .5 + o.f * 6) * 26).toFixed(1));
      o.c.setAttribute('cy', (((o.y + o.v * t) % H + H) % H).toFixed(1));
      o.c.setAttribute('opacity', (.12 + .3 * (.5 + .5 * Math.sin(t * .8 + o.f * 6))).toFixed(2));
    });
  }};
}

/* Een zachte lichtvlek achter het onderwerp. In de meetscènes zweeft er één
   voorwerp in het donker; zonder licht erachter valt het weg in de
   achtergrond, met licht erachter staat het ergens. */
function spot(ouder, x, y, r, kl = '#1D8DB0', sterkte = .5){
  const id = 'spot' + (gradTeller++);
  const rg = el('radialGradient', {id}, defs);
  el('stop', {offset:0, 'stop-color':kl, 'stop-opacity':sterkte}, rg);
  el('stop', {offset:.6, 'stop-color':kl, 'stop-opacity':sterkte * .28}, rg);
  el('stop', {offset:1, 'stop-color':kl, 'stop-opacity':0}, rg);
  return el('circle', {cx:x, cy:y, r, fill:`url(#${id})`}, ouder);
}

/* ------------------------------------------------- de drukschaal in kPa
   Een kleurenkaart zonder legende laat het publiek raden wat rood betekent.
   Deze balk zet de kleuren op een as met kPa erlangs en zet de grens van
   200 kPa er als streep in: daarmee wordt "rood" een getal. */
function kleurschaal(ouder, x, y, w, h){
  const g = groep({}, ouder);
  const id = 'schaal' + (gradTeller++);
  const lg = el('linearGradient', {id, x1:0, y1:1, x2:0, y2:0}, defs);
  BAND.forEach(([o, c]) => el('stop', {offset:o, 'stop-color':c}, lg));
  el('rect', {x, y, width:w, height:h, rx:5, fill:`url(#${id})`,
              stroke:'#0E3352', 'stroke-width':2}, g);
  for (const kpa of [0, 100, 200, 300, 400]){
    const yy = y + h - (kpa / SCHAAL_MAX) * h;
    el('line', {x1:x + w, y1:yy, x2:x + w + 9, y2:yy, stroke:'#5E8AA8',
                'stroke-width':2}, g);
    const t = el('text', {x:x + w + 17, y:yy + 8, fill:'#8FB6D0',
                          'font-size':23, class:'getal'}, g);
    t.textContent = kpa;
  }
  const t = el('text', {x:x + w + 17, y:y - 16, fill:'#8FB6D0',
                        'font-size':20, class:'label'}, g);
  t.textContent = 'kPa';
  /* de grens waaronder de piekdruk moet komen */
  const gy = y + h - (200 / SCHAAL_MAX) * h;
  el('line', {x1:x - 14, y1:gy, x2:x + w + 4, y2:gy, stroke:'#F2F8FC',
              'stroke-width':3, 'stroke-dasharray':'9 7'}, g);
  const gl = el('text', {x:x - 22, y:gy + 8, fill:'#F2F8FC', 'font-size':22,
                         'text-anchor':'end', class:'label'}, g);
  gl.textContent = 'GRENS 200';
  /* het pijltje dat de gemeten piekdruk aanwijst */
  const wijzer = groep({}, g);
  el('path', {d:'M0 0 L20 -11 L20 11 Z', fill:'#F2F8FC'}, wijzer);
  return {g, wijzer, zet(kpa, zichtbaar = 1){
    const yy = y + h - (klem(kpa / SCHAAL_MAX, 0, 1)) * h;
    wijzer.setAttribute('transform', `translate(${x - 12} ${yy.toFixed(1)})`);
    wijzer.setAttribute('opacity', zichtbaar);
  }};
}

/* Een drukmat: de voetvorm als raster van cellen. Eén bouwer, want hij komt
   drie keer terug en moet er alle drie de keren identiek uitzien. */
function drukmat(ouder, mx, my, mw, mh, kol = 18, rij = 38){
  const g = groep({}, ouder);
  const cw = mw / kol, ch = mh / rij, d = Math.min(cw, ch) * .86;
  const cellen = [];
  for (let r = 0; r < rij; r++){
    const t = (r + .5) / rij, [li, la] = rand(t);
    for (let c = 0; c < kol; c++){
      const fx = (c + .5) / kol;
      if (fx >= li && fx <= la)
        cellen.push({e:el('rect', {x:mx + c * cw + (cw - d) / 2,
                                   y:my + mh - (r + 1) * ch + (ch - d) / 2,
                                   width:d, height:d, rx:d * .3, fill:'#051D33'}, g),
                     fx, t});
    }
  }
  return {g, cellen, vul(haarden, piek){
    let top = 0;
    const ruw = cellen.map(c => {
      const v = veld(haarden, c.fx, c.t); if (v > top) top = v; return v;
    });
    const f = (piek / SCHAAL_MAX) / (top || 1);
    cellen.forEach((c, i) => c.e.setAttribute('fill', bandkleur(ruw[i] * f)));
  }};
}

/* ============================================================ dieptelagen
   Dit is het verschil tussen een camera en een vergrootglas.

   Tot nu toe kreeg de hele scene één schaal: inzoomen maakte de tekening
   groter, en dat is precies hoe het eruitzag. Een echte camera die naar
   voren komt ziet de lucht nauwelijks veranderen, de bomen een beetje, en
   de figuur vlak voor je veel. Dat verschil tussen de lagen IS het gevoel
   van diepte — bij Disney heette die opstelling de multiplane camera.

   Elke laag krijgt een diepte: 0 is oneindig ver en beweegt helemaal niet
   mee, 1 is het vlak waar de personages en de tekst staan, boven 1 ligt
   vóór dat vlak en beweegt juist harder. Wat rechtstreeks in de scene
   getekend wordt, staat vanzelf op 1.

   De motor zet per laag een correctie bovenop de cameratransformatie, zodat
   het net uitkomt op de transformatie die bij die diepte hoort. */
const VER = .18, MIDDEN = .5, VLAK = 1;
let lagenNu = [];
function laag(ouder, diepte){
  const l = groep({}, ouder);
  lagenNu.push({g:l, d:diepte});
  return l;
}

/* ============================================================== de scènes */
const scenes = [];
function scene(duur, bouw){
  const g = groep({opacity:0});
  lagenNu = [];
  const api = bouw(g);
  scenes.push({g, duur, lagen:lagenNu, teken:api.teken, shots:api.shots});
}

/* Een shot is een KADER: de rechthoek [x, y, breedte, hoogte] die in beeld
   moet passen. De vergroting volgt daaruit in plaats van met de hand gezet
   te worden. Dat is het hele punt: met een los ingesteld vergrotingsgetal
   kan een kop of een getal half buiten beeld vallen zonder dat je het aan
   het getal ziet; met een kader kan dat per definitie niet.

   De vergroting is de kleinste van breedte en hoogte, zodat het kader er
   helemaal in past en de rest opgevuld wordt met wat eromheen ligt. Nooit
   kleiner dan 1: verder uitzoomen dan het doek heeft geen zin.

   `naar` laat de camera binnen het shot van het ene kader naar het andere
   glijden; de sprong van het ene shot naar het volgende is een harde snit. */
function kaderCam(k){
  const [x, y, w, h] = k;
  const z = Math.max(1, Math.min(B / w, H / h));
  return [x + w / 2, y + h / 2, z];
}
function camera(u, shots){
  if (!shots || !shots.length) return [B / 2, H / 2, 1];
  let i = 0;
  while (i < shots.length - 1 && u >= shots[i + 1].t) i++;
  const sh = shots[i], eind = i < shots.length - 1 ? shots[i + 1].t : 1;
  /* De beweging vult niet het hele shot. Ze begint pas na een rustpunt en
     is voor het einde klaar, zodat de camera staat als er iets te lezen
     valt. Een camera die onafgebroken kruipt is wat een diavoorstelling
     van een film onderscheidt. */
  const ruw = klem((u - sh.t) / (eind - sh.t), 0, 1);
  const van = sh.van !== undefined ? sh.van : .14;
  const tot = sh.tot !== undefined ? sh.tot : .86;
  const p = soepel(klem((ruw - van) / (tot - van), 0, 1));
  const a = kaderCam(sh.kader), b = sh.naar ? kaderCam(sh.naar) : a;
  return [meng(a[0], b[0], p), meng(a[1], b[1], p), meng(a[2], b[2], p)];
}
/* het hele doek, het kader waar de meeste scenes op staan */
const DOEK = [0, 0, B, H];

/* grote koptekst met een staggered opkomst per regel */
function kop(ouder, regels, x, y, gr, kl = 'var(--ink)'){
  const t = el('text', {x, y, fill:kl, 'font-size':gr, class:'kop',
                        'letter-spacing':'-.005em',
                        'paint-order':'stroke', stroke:'rgba(3,12,22,.5)',
                        'stroke-width':8, 'stroke-linejoin':'round'}, ouder);
  const spans = regels.map((r, i) => {
    const s = el('tspan', {x, dy: i ? gr * 1.06 : 0}, t);
    s.textContent = r;
    return s;
  });
  return {t, spans, toon(u, uit = 1){
    spans.forEach((s, i) => {
      const p = stuk(u, .02 + i * .06, .34 + i * .06, uitloop);
      s.setAttribute('opacity', (p * uit).toFixed(3));
      s.setAttribute('dx', ((1 - p) * -26).toFixed(1));
    });
  }};
}

/* een regel kleine tekst met contour, zodat hij op elk beeld leesbaar blijft */
function regelTekst(ouder, regels, x, y, gr = 30, kl = '#D6E6F1', tussen = 46){
  const t = el('text', {x, y, fill:kl, 'font-size':gr, class:'tekst',
                        'paint-order':'stroke', stroke:'rgba(3,12,22,.8)',
                        'stroke-width':6, 'stroke-linejoin':'round'}, ouder);
  regels.forEach((r, i) => {
    const s = el('tspan', {x, dy: i ? tussen : 0}, t); s.textContent = r;
  });
  return t;
}

/* ----------------------------------------------------------- 0. titelkaart
   Een lus heeft een begin nodig. Wie op de stand halverwege binnenvalt, ziet
   binnen twee minuten deze kaart opnieuw en weet dan pas waar hij naar keek. */

                         150, 700, 32);

/* --------------------------------------------------------- 2. het legoblokje */
scene(11, g => {
  const achter = laag(g, VER);
  lucht(achter, 'avond'); heuvels(achter, 'avond');
  nevel(laag(g, MIDDEN), 'avond');
  grasveld(g, 'avond');
  const blokL = blokje(g, 600), blokF = blokje(g, 1330);
  const f = maakFiguur(FRANS, g), l = maakFiguur(LOTTE, g);
  const ster = el('path', {d:sterPad(11), fill:'#FFB020', opacity:0,
                           stroke:'#FF7A00', 'stroke-width':6}, g);
  const au = el('text', {x:430, y:330, fill:'#FF7A00', 'font-size':140,
                         class:'kop', 'text-anchor':'middle', opacity:0}, g);
  au.textContent = 'AU!';
  /* De pointe van de scene stond alleen in de ondertitel. Nu staat ze in
     het beeld, naast opa, in het laatste shot. */
  const k = kop(g, ['Opa voelt', 'het niet.'], 820, 478, 60);
  function blokje(ouder, x){
    const gg = groep({transform:`translate(${x} ${GROND - 62})`}, ouder);
    el('ellipse', {cx:55, cy:66, rx:62, ry:12, fill:'url(#schaduw)'}, gg);
    el('rect', {x:0, y:20, width:110, height:42, rx:7, fill:verlicht('#FF7A00', .3),
                stroke:'#A64E00', 'stroke-width':3}, gg);
    for (let i = 0; i < 4; i++)
      el('rect', {x:8 + i * 25, y:2, width:18, height:24, rx:7,
                  fill:verlicht('#FF9433', .3), stroke:'#A64E00', 'stroke-width':3}, gg);
    return gg;
  }
  function sterPad(n){
    let d = '';
    for (let i = 0; i < n * 2; i++){
      const a = i * Math.PI / n - Math.PI / 2, r = i % 2 ? 26 : 62;
      d += (i ? 'L' : 'M') + (Math.cos(a) * r).toFixed(1) + ' ' + (Math.sin(a) * r).toFixed(1) + ' ';
    }
    return d + 'Z';
  }
  return {
    shots:[{t:0, kader:[60,220,1500,844], naar:[110,228,1400,788], van:.10, tot:.92},
           {t:0.30, kader:[180,190,700,720], naar:[196,198,668,687], van:.06, tot:.70},
           {t:0.62, kader:[820,380,900,560], naar:[836,390,868,540], van:.12, tot:.82}],
    teken(u){
      /* Lotte loopt ernaartoe, springt op en komt neer */
      const aan = stuk(u, .02, .30, soepel);
      const spring = stuk(u, .32, .46, uitloop) - stuk(u, .50, .62, inloop);
      /* eerst door de knieen, dan pas omhoog: zonder aanzet leest een sprong
         als een figuur die verplaatst wordt in plaats van die springt */
      const hurk = stuk(u, .27, .32, soepel) * (1 - stuk(u, .32, .37, soepel));
      const lx = meng(220, 500, aan) - spring * 40;
      poseer(l, lx, GROND - 126 * 2.65, 2.65, {
        pas: loopFase(lx - 220, 2.65), zwaai: aan < 1 && spring < .02 ? 13 : 0,
        hop: spring * 96 - hurk * 11,
        beenR: spring > .02 ? -spring * 46 : undefined,
        beenL: spring > .02 ? spring * 16 : undefined,
        armL: spring > .02 ? -spring * 30 : undefined,
        armR: spring > .02 ? spring * 30 : undefined,
        kanteling: spring > .02 ? spring * -5 : undefined,
        mond: spring > .15 ? 'open' : 'lach', kijk: spring * -6});
      const bloem = stuk(u, .33, .40, uitloop) * (1 - stuk(u, .50, .60, soepel));
      ster.setAttribute('transform',
        `translate(560 ${GROND - 64}) scale(${.5 + bloem * .9}) rotate(${bloem * 40})`);
      ster.setAttribute('opacity', bloem);
      au.setAttribute('opacity', bloem);
      au.setAttribute('transform', `translate(0 ${(1 - bloem) * 26})`);
      /* opa stapt in alle rust op het zijne */
      const stap = stuk(u, .62, .82, soepel);
      poseer(f, meng(1180, 1258, stap), GROND - 126 * 2.9 - stap * 62, 2.9,
             {pas: stap < 1 ? u * 12 : 0, zwaai: stap < 1 && stap > 0 ? 9 : 0});
      k.toon(klem((u - .66) / .30, 0, 1));
    }};
});

/* ------------------------------------------------------- 6. de meting
   Het protocol vraagt minstens twaalf stappen per voet op zelfgekozen
   comfortsnelheid — niet een vaste afstand. Daarom telt hier de stapteller
   mee in plaats van een meetlint langs de grond. */
scene(8.5, g => {
  lucht(laag(g, VER));
  const stof = stofjes(laag(g, MIDDEN), 18);
  el('rect', {x:-200, y:GROND, width:B + 400, height:H - GROND, fill:'#08243C'}, g);
  el('rect', {x:-200, y:GROND, width:B + 400, height:4, fill:'#215B84'}, g);
  const sporen = [];
  for (let i = 0; i < 12; i++){
    const gg = groep({opacity:0}, g), x = 200 + i * 98, y = 900 + (i % 2 ? 26 : 0);
    el('path', {d:voetPad(x, y, 36, 54, 24), fill:'#52BDEC'}, gg);
    el('circle', {cx:x + .44 * 36, cy:y + 54 - .66 * 54, r:6.5, fill:'#FF7A00'}, gg);
    const nr = el('text', {x:x + 18, y:y + 92, fill:'#8FB6D0', 'font-size':26,
                           'text-anchor':'middle', class:'getal'}, gg);
    nr.textContent = i + 1;
    sporen.push({g:gg, x});
  }
  const f = maakFiguur(FRANS, g);
  const kastje = groep({}, g);
  el('rect', {x:-30, y:-24, width:60, height:46, rx:9, fill:verlicht('#153F5E', .2),
              stroke:'#0C2B42', 'stroke-width':3}, kastje);
  const led = el('circle', {cx:0, cy:-1, r:9, fill:'#4FC08D'}, kastje);

  /* Een meetpaneel met een meelopende drukcurve. Twee bulten per stap: de
     hiel die neerkomt en de voorvoet die afzet. Dit is wat de zool ziet. */
  const paneel = groep({opacity:0}, g);
  el('rect', {x:1180, y:130, width:620, height:300, rx:18, fill:'#06192B',
              stroke:'#215B84', 'stroke-width':2.5}, paneel);
  const pl = el('text', {x:1214, y:178, fill:'#8FB6D0', 'font-size':21, class:'label'}, paneel);
  pl.textContent = 'DRUK ONDER DE VOET';
  const N = 260, buf = new Array(N).fill(0);
  const curve = el('polyline', {fill:'none', stroke:'#52BDEC', 'stroke-width':3,
                                'stroke-linejoin':'round'}, paneel);
  el('line', {x1:1214, y1:392, x2:1766, y2:392, stroke:'#1B4A6E', 'stroke-width':2}, paneel);
  const hz = el('text', {x:1766, y:178, fill:'#4FC08D', 'font-size':21,
                         'text-anchor':'end', class:'label'}, paneel);
  hz.textContent = '100 PER SECONDE';

  const k = kop(g, ['Twaalf stappen', 'per voet'], 150, 236, 84);
  const bij = regelTekst(g, ['op zijn eigen tempo'], 154, 392, 32, '#8FB6D0');
  return {
    shots:[{t:0, kader:DOEK}],
    teken(u){
      stof.update(NU);
      const p = soepel(klem(u / .9, 0, 1));
      const fx = meng(200, 1400, p);
      const fase = loopFase(fx - 200, 3.3);
      poseer(f, fx, GROND - 126 * 3.3, 3.3, {pas:fase, zwaai:13});
      kastje.setAttribute('transform', `translate(${fx + 205} ${GROND - 190})`);
      led.setAttribute('opacity', .5 + .5 * Math.sin(NU * 9));

      k.toon(u);
      bij.setAttribute('opacity', stuk(u, .20, .38, uitloop));
      sporen.forEach(s => {
        const v = klem((fx + 60 - s.x) / 90, 0, 1);
        s.g.setAttribute('opacity', v);
        s.g.setAttribute('transform', `translate(0 ${(1 - v) * 10})`);
      });

      /* de curve schuift door; de bulten volgen de pas */
      const ph = ((fase / (2 * Math.PI)) % 1 + 1) % 1;
      const v = 68 * Math.exp(-((ph - .18) ** 2) / .0035)
              + 96 * Math.exp(-((ph - .52) ** 2) / .006);
      buf.push(v); buf.shift();
      let d = '';
      for (let i = 0; i < N; i++)
        d += `${(1214 + i * 552 / (N - 1)).toFixed(1)},${(392 - buf[i] * 1.7).toFixed(1)} `;
      curve.setAttribute('points', d);
      paneel.setAttribute('opacity', stuk(u, .26, .40, uitloop));
    }};
});

/* --------------------------------- 9. de drukmat: met zool, en de vergelijking
   De sterkste beelden van het hele verhaal staan hier naast elkaar. Eerst

   van zonder zool ernaast, zodat het verschil één oogopslag wordt. */
scene(12, g => {
  lucht(laag(g, VER));
  const stof = stofjes(laag(g, MIDDEN), 20);
  const mw = 330, mh = 640, my = 210;
  spot(g, 810, 540, 620, '#1D8DB0', .32);

  /* links de bevroren meting zonder zool, rechts de meting die meeverandert */
  const ghost = groep({opacity:0}, g);
  const matA = drukmat(ghost, 230, my, mw, mh);
  matA.vul(VOOR, 312);
  const aL = el('text', {x:230, y:my - 76, fill:'#8FB6D0', 'font-size':25, class:'label'}, ghost);
  aL.textContent = 'ZONDER ZOOL';
  const aN = el('text', {x:230, y:my - 18, fill:'#52BDEC', 'font-size':64, class:'getal'}, ghost);
  aN.textContent = '312 kPa';

  const levend = groep({}, g);
  const matB = drukmat(levend, 640, my, mw, mh);
  const bL = el('text', {x:640, y:my - 76, fill:'#8FB6D0', 'font-size':25,
                         class:'label', opacity:0}, levend);
  bL.textContent = 'MET ZOOL';
  const bN = el('text', {x:640, y:my - 18, fill:'#4FC08D', 'font-size':64,
                         class:'getal', opacity:0}, levend);

  const pijl = groep({opacity:0}, g);
  el('path', {d:'M0 0 h44 M30 -14 L46 0 L30 14', fill:'none', stroke:'#4FC08D',
              'stroke-width':6, 'stroke-linecap':'round', 'stroke-linejoin':'round'}, pijl);
  pijl.setAttribute('transform', `translate(578 ${my + mh / 2})`);

  /* Het grote getal tijdens de close-up. De eenheid staat erboven in plaats
     van ernaast: naast het getal moest de breedte elk beeld opnieuw opgemeten
     worden, en bij het inzoomen viel ze buiten het kader. */
  const grootL = el('text', {x:980, y:360, fill:'#8FB6D0', 'font-size':24, class:'label'}, g);
  grootL.textContent = 'HOOGSTE DRUK IN kPa';
  const groot = el('text', {x:980, y:500, 'font-size':150, class:'getal', fill:'#FF7A00'}, g);

  /* het paneel rechts, dat na het uitzoomen het verschil samenvat */
  const paneel = groep({opacity:0}, g);
  let vorigeW = -1;
  const k = kop(paneel, ['En kijk:', 'het rood', 'koelt af'], 1090, 300, 86);
  const schaal = kleurschaal(paneel, 1700, 250, 34, 520);
  const som = el('text', {x:1094, y:620, fill:'#F2F8FC', 'font-size':62, class:'getal'}, paneel);
  som.textContent = '312 → 186 kPa';
  const onder = regelTekst(paneel, ['Onder de grens van 200 kPa,', 'in dezelfde meting.'],
                           1094, 692, 33, '#4FC08D', 44);
  return {
    shots:[{t:0, kader:[430,150,760,790], naar:[600,190,700,680], van:.14, tot:.52},
           {t:0.56, kader:[600,190,700,680], naar:DOEK, van:.05, tot:.50}],
    teken(u){
      stof.update(NU);
      const t = soepel(klem((u - .18) / .42, 0, 1));
      const w = Math.round(meng(312, 186, t));
      /* vierhonderd cellen hertekenen heeft alleen zin als het getal verandert */
      if (w !== vorigeW){
        vorigeW = w;
        matB.vul(VOOR.map((a, i) => a.map((v, j) => meng(v, NA[i][j], t))), w);
      }

      /* het grote getal is er alleen in de close-up */
      const dichtbij = stuk(u, .24, .33) * (1 - stuk(u, .54, .62));
      groot.textContent = w;
      groot.setAttribute('fill', w > 200 ? '#FF7A00' : '#4FC08D');
      groot.setAttribute('opacity', dichtbij);
      grootL.setAttribute('opacity', dichtbij);

      /* daarna het overzicht: de oude meting schuift ernaast */
      const breed = stuk(u, .72, .86, uitloop);
      ghost.setAttribute('opacity', breed);
      ghost.setAttribute('transform', `translate(${((1 - breed) * -210).toFixed(1)} 0)`);
      pijl.setAttribute('opacity', stuk(u, .80, .90, uitloop));
      bN.textContent = w + ' kPa';
      bL.setAttribute('opacity', breed); bN.setAttribute('opacity', breed);
      paneel.setAttribute('opacity', stuk(u, .74, .86, uitloop));
      k.toon(klem((u - .72) / .24, 0, 1));
      som.setAttribute('opacity', stuk(u, .82, .91, uitloop));
      onder.setAttribute('opacity', stuk(u, .88, .97, uitloop));
      schaal.zet(w, 1);
    }};
});

/* ------------------------------------------------------------- 10. de sensor
   Een zool helpt alleen als hij gedragen wordt. Daarom zit er een kleine
   temperatuursensor in — geen plaatsbepaling, geen geluid, geen camera. */
scene(8, g => {
  lucht(laag(g, VER));

  const sx = zx + .5 * zw, sy = zy + zh - .3 * zh;

                             'stroke-width':4}, g);

  el('rect', {x:sx - 14, y:sy - 7, width:28, height:14, rx:4, fill:'#0C2B42', opacity:.6}, chip);
  const wijs = el('path', {d:`M${sx + 40} ${sy - 10} L${sx + 150} ${sy - 90} L${sx + 300} ${sy - 90}`,
                           fill:'none', stroke:'#4FC08D', 'stroke-width':3,

  const wl = regelTekst(g, ['meet alleen temperatuur'], sx + 160, sy - 106, 29, '#4FC08D');
  wl.setAttribute('opacity', 0);

  /* de week: zeven staven die oplopen naar de grens van 80% */
  const bx0 = 1120, by0 = 700, bw = 76, bh = 380;
  const week = groep({opacity:0}, g);
  const dagen = ['ma','di','wo','do','vr','za','zo'];
  const hoogtes = [.88, .92, .79, .95, .86, .71, .9];
  const staven = dagen.map((dag, i) => {
    const x = bx0 + i * (bw + 22);
    el('rect', {x, y:by0 - bh, width:bw, height:bh, rx:8, fill:'#0A2A44'}, week);
    const s = el('rect', {x, y:by0, width:bw, height:0, rx:8,
                          fill:verlicht('#4FC08D', .25)}, week);
    const t = el('text', {x:x + bw / 2, y:by0 + 42, fill:'#8FB6D0', 'font-size':25,
                          'text-anchor':'middle', class:'label'}, week);
    t.textContent = dag.toUpperCase();
    return {s, h:hoogtes[i]};
  });
  const doel = el('line', {x1:bx0 - 24, y1:by0 - bh * .8, x2:bx0 + 7 * (bw + 22),
                           y2:by0 - bh * .8, stroke:'#F2F8FC', 'stroke-width':3,
                           'stroke-dasharray':'9 7', opacity:0}, week);
  const doelT = el('text', {x:bx0 - 34, y:by0 - bh * .8 + 9, fill:'#F2F8FC',
                            'font-size':24, 'text-anchor':'end', class:'label',
                            opacity:0}, week);
  doelT.textContent = 'DOEL 80%';
  const k = kop(g, ['Wordt de zool', 'ook gedragen?'], 1094, 250, 74);
  return {
    shots:[{t:0, kader:[330,220,740,570]},
           {t:0.26, kader:[330,220,740,570], naar:DOEK, van:.04, tot:.42}],
    teken(u){
      stof.update(NU);
      const p = (NU * .6) % 1;
      puls.setAttribute('r', 30 + p * 120);
      puls.setAttribute('opacity', (1 - p) * .55);
      chip.setAttribute('opacity', stuk(u, .02, .14));
      wijs.setAttribute('stroke-dashoffset', 520 * (1 - stuk(u, .05, .20, uitloop)));
      wijs.setAttribute('opacity', 1 - stuk(u, .28, .38));
      wl.setAttribute('opacity', stuk(u, .12, .24, uitloop) * (1 - stuk(u, .28, .38)));
      k.toon(klem((u - .52) / .26, 0, 1));
      week.setAttribute('opacity', stuk(u, .52, .62, uitloop));
      staven.forEach((b, i) => {
        const v = stuk(u, .58 + i * .035, .72 + i * .035, uitloop) * b.h;
        b.s.setAttribute('height', (bh * v).toFixed(1));

        b.s.setAttribute('fill', verlicht(b.h >= .8 ? '#4FC08D' : '#FFD24A', .25));
      });
      const dz = stuk(u, .86, .95, uitloop);
      doel.setAttribute('opacity', dz); doelT.setAttribute('opacity', dz);
    }};
});

  boom(ver, 300, .7, 'avond', GROND - 80); boom(ver, 1500, .62, 'avond', GROND - 88);

  const lucht_ = vogels(midden);
  const dicht = groep({}, g); boom(dicht, 1700, 1.2, 'avond'); boom(dicht, 760, .9, 'avond');
  grasveld(dicht, 'avond');
  const f = maakFiguur(FRANS, g), l = maakFiguur(LOTTE, g);
  const k = kop(g, ['En zondag', 'gaan ze weer'], 130, 230, 100);
  return {
    shots:[{t:0, kader:[90,50,1740,979], naar:DOEK, van:.10, tot:.84}],
    teken(u){
      lucht_.update(NU);
      const weg = u * 700;
      ver.setAttribute('transform', `translate(${-u * 220} 0)`);
      dicht.setAttribute('transform', `translate(${-weg} 0)`);
      poseer(f, 500 + u * 110, GROND - 126 * 3.3, 3.3,
             {pas:loopFase(weg, 3.3), zwaai:12});
      poseer(l, 930 + u * 130, GROND - 126 * 2.65, 2.65,
             {pas:loopFase(weg, 2.65) + Math.PI, zwaai:13,
              kijk:Math.sin(loopFase(weg, 2.65)) * 4});
      k.toon(u);
    }};
});

/* ------------------------------------------------------------ 12. de studie
   Hier komt het publiek van een congres binnen: honderdvierenveertig mensen,
   zes voetklinieken, achttien maanden, en een toewijzing die je ziet
   gebeuren. De opzet in één beeld, zonder één woord jargon. */
scene(10, g => {
  lucht(laag(g, VER));
  const stof = stofjes(laag(g, MIDDEN), 18);
  spot(g, 960, 560, 780, '#1D8DB0', .26);
  const k = kop(g, ['Honderdvierenveertig mensen,', 'zes voetklinieken'], 140, 190, 70);

  /* 144 stippen: twaalf kolommen van twaalf, die in twee groepen uiteengaan */
  const stippen = [];
  for (let i = 0; i < 144; i++){
    const r = Math.floor(i / 12), c = i % 12;
    const links = i % 2 === 0;
    stippen.push({
      e:el('circle', {r:13, fill:'#2A6C9A', opacity:0}, g),
      x0:660 + c * 52, y0:330 + r * 40,
      x1:(links ? 330 : 1150) + c * 40, y1:360 + r * 34,
      links, i});
  }
  const labels = [['de nieuwe aanpak', 330, '#4FC08D'], ['de gebruikelijke zorg', 1150, '#52BDEC']]
    .map(([naam, x, kl]) => {
      const t = el('text', {x:x + 230, y:790, fill:kl, 'font-size':34,
                            'text-anchor':'middle', class:'tekst', opacity:0}, g);
      t.textContent = naam;
      const n = el('text', {x:x + 230, y:850, fill:kl, 'font-size':56,
                            'text-anchor':'middle', class:'getal', opacity:0}, g);
      n.textContent = '72';
      return {t, n};
    });

  /* de tijdlijn: achttien maanden, met de meetmomenten erop */
  const tijd = groep({opacity:0}, g);
  const tx = 360, tw = 1200, ty = 930;
  el('line', {x1:tx, y1:ty, x2:tx + tw, y2:ty, stroke:'#215B84', 'stroke-width':4}, tijd);
  const voortgang = el('line', {x1:tx, y1:ty, x2:tx, y2:ty, stroke:'#52BDEC',
                                'stroke-width':4}, tijd);
  [0, 6, 12, 18].forEach(m => {
    const x = tx + (m / 18) * tw;
    el('circle', {cx:x, cy:ty, r:9, fill:'#52BDEC'}, tijd);
    const t = el('text', {x, y:ty - 26, fill:'#8FB6D0', 'font-size':25,
                          'text-anchor':'middle', class:'label'}, tijd);
    t.textContent = m + ' MND';
  });
  return {
    shots:[{t:0, kader:DOEK}],
    teken(u){
      stof.update(NU);
      k.toon(u);
      const split = stuk(u, .36, .64, soepel);
      stippen.forEach(s => {
        const op = stuk(u, .08 + (s.i / 144) * .22, .18 + (s.i / 144) * .22);
        s.e.setAttribute('opacity', op * .95);
        s.e.setAttribute('cx', meng(s.x0, s.x1, split).toFixed(1));
        s.e.setAttribute('cy', meng(s.y0, s.y1, split).toFixed(1));
        s.e.setAttribute('fill', split > .05
          ? kleur('#2A6C9A', s.links ? '#4FC08D' : '#52BDEC', split) : '#2A6C9A');
      });
      const lz = stuk(u, .58, .72, uitloop);
      labels.forEach(l => { l.t.setAttribute('opacity', lz); l.n.setAttribute('opacity', lz); });
      tijd.setAttribute('opacity', stuk(u, .70, .82, uitloop));
      voortgang.setAttribute('x2', (tx + tw * stuk(u, .74, .98, soepel)).toFixed(1));
    }};
});

/* ------------------------------------------------------------ 13. de vraag */
scene(8, g => {
  const achter = laag(g, VER);
  lucht(achter, 'avond'); heuvels(achter, 'avond');
  nevel(laag(g, MIDDEN), 'avond');
  grasveld(g, 'avond');
  const f = maakFiguur(FRANS, g), l = maakFiguur(LOTTE, g);

                           'zoeken het nu samen uit.'], 134, 424, 32);
  /* de partners: twee echte logo's, en de zes centra bij naam. Voor de

  /* De twee logo's op hun eigen witte plaatje: even hoog, even veel lucht
     eromheen, en dus verschillend breed. Zo horen logo's naast elkaar te

  const pl1 = 406, pb1 = 54 * V_KUL + 34;

      poseer(f, 1240, GROND - 126 * 3.3, 3.3, {pas:0, zwaai:0});
      poseer(l, 1560, GROND - 126 * 2.65, 2.65, {pas:0, zwaai:0, kijk:-6});
      r.setAttribute('opacity', stuk(u, .22, .42, uitloop));
      balk.setAttribute('opacity', stuk(u, .42, .60, uitloop));
      cen.setAttribute('opacity', 1);
      uitn.setAttribute('opacity', stuk(u, .64, .80, uitloop));
    }};
});

/* ===================================================== diepte en afwerking
   Drie lagen over alles heen. De onscherpe voorgrond geeft het beeld diepte —
   het oog leest scherpte als afstand. Het vignet trekt de blik naar het
   midden. De korrel haalt de laatste plastic glans eraf; zonder korrel blijft
   vlakke vectorkleur er altijd digitaal uitzien. */
const overlay = groep({'pointer-events':'none'});

const bl = el('filter', {id:'voorblur', x:'-10%', y:'-10%',
                         width:'120%', height:'120%'}, defs);
el('feGaussianBlur', {stdDeviation:9}, bl);
/* De voorgrond ligt vóór het vlak van de personages en hoort dus harder mee
   te bewegen dan zij. De parallax zit op de ouder, zodat het vervaagde
   groepje zelf niet elk beeld opnieuw door het filter moet. */
const voorgrond = groep({}, overlay);
const vg = groep({filter:'url(#voorblur)', opacity:.7}, voorgrond);
for (let i = 0; i < 16; i++){
  const x = -60 + i * 132 + (i * 61 % 70), h = 62 + (i * 47 % 58);
  el('path', {d:`M${x} ${H + 20} q${-26} ${-h * .7} ${-8} ${-h} q30 ${h * .32} 34 ${h} Z`,
              fill:'#04121E'}, vg);
  el('ellipse', {cx:x + 40, cy:H + 46, rx:120, ry:44, fill:'#04121E'}, vg);
}

const vgr = el('radialGradient', {id:'vignet', cx:.5, cy:.46, r:.82}, defs);
el('stop', {offset:.58, 'stop-color':'#000', 'stop-opacity':0}, vgr);
const vgrBuiten = el('stop', {offset:1, 'stop-color':'#000', 'stop-opacity':.34}, vgr);
el('rect', {x:0, y:0, width:B, height:H, fill:'url(#vignet)'}, overlay);

/* Scherptediepte hebben we niet, maar aandacht sturen kan ook zo: hoe
   dichter de camera komt, hoe strakker het vignet zich om het onderwerp
   sluit. Dat is wat "focus" hier moet doen. */
function stelScherpte(z){
  const t = klem((z - 1) / 1.1, 0, 1);
  vgr.setAttribute('r', (.82 - t * .24).toFixed(3));
  vgrBuiten.setAttribute('stop-opacity', (.34 + t * .20).toFixed(3));
}

/* Het logo blijft de hele film rechtsonder staan. Op een stand wordt er
   gefotografeerd; elke foto hoort het merk mee te dragen. Op de titelkaart
   en de eindkaart staat het al groot in beeld, dus daar niet. */
const merkG = groep({opacity:.9}, overlay);
el('image', {href:LOGO_PARADISE, x:1800 - 62 * V_PARADISE, y:990, height:62},
   merkG);

const kf = el('filter', {id:'korrel'}, defs);
el('feTurbulence', {type:'fractalNoise', baseFrequency:.9, numOctaves:2,
                    stitchTiles:'stitch'}, kf);
el('feColorMatrix', {type:'saturate', values:0}, kf);
const korrel = el('rect', {x:0, y:0, width:B, height:H, filter:'url(#korrel)',
                           opacity:.055, 'mix-blend-mode':'overlay'}, overlay);

/* ============================================================== de motor */
const TOT = scenes.reduce((s, x) => s + x.duur, 0);
const STARTEN = scenes.reduce((a, s) => (a.push(a[a.length - 1] + s.duur), a), [0]);
const balkEl = document.getElementById('balk');
let klok = 0, vorigeScene = -1, loopt = true, laatste = 0;

/* Een stand draait uren door op onbekende hardware. Als het beeld hapert is
   de korrel en de onscherpe voorgrond het eerste wat mag sneuvelen: dat kost
   het minst aan verhaal en het meest aan rekenwerk. */
let som = 0, tel = 0, versoberd = false;
function meetSnelheid(dt){
  if (versoberd) return;
  som += dt; tel++;
  if (tel < 180) return;
  const gem = som / tel;
  som = 0; tel = 0;
  if (gem > .024){
    versoberd = true;
    korrel.setAttribute('opacity', 0);
    vg.setAttribute('opacity', 0);
    vg.removeAttribute('filter');
  }
}

function beeld(nu){
  requestAnimationFrame(beeld);
  const dt = Math.min((nu - laatste) / 1000, .1);
  laatste = nu;
  if (!loopt) return;
  meetSnelheid(dt);
  klok = (klok + dt) % TOT;
  NU += dt;

  let t = klok, i = 0;
  while (i < scenes.length - 1 && t > scenes[i].duur){ t -= scenes[i].duur; i++; }
  const sc = scenes[i], u = klem(t / sc.duur, 0, 1);

  if (i !== vorigeScene){
    /* wat niet in beeld is, wordt ook niet getekend: met veertien scènes
       tegelijk in de boom kost alleen al het samenstellen beelden per seconde */
    scenes.forEach((s, j) => { s.g.style.display = j === i ? '' : 'none'; });
    vorigeScene = i;
  }
  /* zachte in- en uitvloeier. Geen extra duw op de vergroting: die at aan
     het kader, en dan klopt de garantie van kaderCam niet meer. */
  const in_ = stuk(u, 0, .05), uit = 1 - stuk(u, .95, 1);
  sc.g.setAttribute('opacity', Math.min(in_, uit).toFixed(3));
  /* de camera: kader per shot */
  const [cx, cy, z] = camera(u, sc.shots);
  sc.g.setAttribute('transform',
    `translate(${(B / 2 - cx * z).toFixed(2)} ${(H / 2 - cy * z).toFixed(2)}) scale(${z.toFixed(4)})`);
  /* en per laag de correctie die hem op zijn eigen diepte zet */
  for (const L of sc.lagen){
    const zl = 1 + (z - 1) * L.d;
    const lx = meng(B / 2, cx, L.d), ly = meng(H / 2, cy, L.d);
    L.g.setAttribute('transform',
      `translate(${((cx * z - lx * zl) / z).toFixed(2)} ${((cy * z - ly * zl) / z).toFixed(2)})` +
      ` scale(${(zl / z).toFixed(5)})`);
  }
  /* de voorgrond op zijn eigen diepte, en het vignet dat dichttrekt */
  const zv = 1 + (z - 1) * 1.55;
  const vx = meng(B / 2, cx, 1.55), vy = meng(H / 2, cy, 1.55);
  voorgrond.setAttribute('transform',
    `translate(${(B / 2 - vx * zv).toFixed(2)} ${(H / 2 - vy * zv).toFixed(2)}) scale(${zv.toFixed(4)})`);
  stelScherpte(z);
  merkG.setAttribute('opacity', (i === 0 || i === scenes.length - 1) ? 0 : .9);
  sc.teken(u);
  balkEl.style.width = (klok / TOT * 100) + '%';
}

/* ====================================================== bediening op de stand
   Uitgangspunt: wie langsloopt kan niets stukmaken. Een klik of een tik doet
   daarom niets meer aan de film — dat was op een aanraakscherm de zekerste
   manier om hem uren bevroren te laten staan. Pauzeren gaat met het
   toetsenbord, en herstart zichzelf als het vergeten wordt. */
let pauzeTimer = null;
function zetPauze(v){
  loopt = !v;
  document.body.classList.toggle('gepauzeerd', v);
  clearTimeout(pauzeTimer);
  if (v) pauzeTimer = setTimeout(() => zetPauze(false), 45000);
}
function naarScene(i){
  i = (i % scenes.length + scenes.length) % scenes.length;
  klok = STARTEN[i] + .001;
}
function huidigeScene(){
  let t = klok, i = 0;
  while (i < scenes.length - 1 && t > scenes[i].duur){ t -= scenes[i].duur; i++; }
  return i;
}

/* Het scherm mag niet in slaap vallen halverwege de dag. */
let slot = null;
async function houdWakker(){
  try {
    if ('wakeLock' in navigator && !slot)
      slot = await navigator.wakeLock.request('screen');
    if (slot) slot.addEventListener('release', () => { slot = null; });
  } catch (e) { /* niet elke browser of context staat dit toe */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') houdWakker();
});

/* de muisaanwijzer verdwijnt als er niets mee gebeurt */
let muisTimer = null;
addEventListener('mousemove', () => {
  document.body.classList.remove('geenmuis');
  document.body.classList.add('toonhint');
  clearTimeout(muisTimer);
  muisTimer = setTimeout(() => {
    document.body.classList.add('geenmuis');
    document.body.classList.remove('toonhint');
  }, 2600);
});
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('dragstart', e => e.preventDefault());

addEventListener('keydown', e => {
  switch (e.key){
    case ' ': case 'p': case 'P':
      e.preventDefault(); zetPauze(loopt); break;
    case 'r': case 'R': case 'Home':
      klok = 0; zetPauze(false); break;
    case 'f': case 'F':
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
      break;
    /* pijltjes en PageUp/PageDown, zodat een presentatieklikker werkt */
    case 'ArrowRight': case 'PageDown':
      e.preventDefault(); naarScene(huidigeScene() + 1); break;
    case 'ArrowLeft': case 'PageUp':
      e.preventDefault(); naarScene(huidigeScene() - 1); break;
  }
});

/* volledig scherm en wakker houden mogen alleen na een gebaar; vandaar de
   startknop, die daarna verdwijnt */
const startPaneel = document.getElementById('start');
document.getElementById('startknop').addEventListener('click', async () => {
  startPaneel.classList.add('weg');
  try { await document.documentElement.requestFullscreen(); } catch (e) {}
  houdWakker();
  klok = 0; zetPauze(false);
  document.body.classList.add('geenmuis');
});
/* wie de knop links laat liggen, krijgt de film alsnog: na tien seconden
   verdwijnt het paneel vanzelf en loopt alles in het venster door */
setTimeout(() => startPaneel.classList.add('weg'), 10000);

/* Wachten op de letters voordat het eerste beeld valt. Anders springt alle
   tekst één keer van breedte zodra DM Sans binnen is, en dat zie je. */
const aanDeSlag = () => requestAnimationFrame(nu => {
  laatste = nu; requestAnimationFrame(beeld);
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(aanDeSlag);
else aanDeSlag();
</script>
