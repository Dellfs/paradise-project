function ecrf(n,label){var f=ECRF_FILES[n];var txt=label||('eCRF '+n.replace('b',' bis'));if(f){return '<a class="ecrf" href="'+encodeURI(f)+'" target="_blank" rel="noopener" title="'+f.replace(/"/g,'&quot;')+'">'+txt+'</a>';}return '<span class="ecrf off" title="'+tr(["bestand niet beschikbaar","file not available"])+'">'+txt+'</span>';}
function ecrfList(arr){return '<span class="ecrflist">'+arr.map(function(n){return ecrf(n);}).join('')+'</span>';}

function applyEcrfFilters(){
  var input=document.getElementById("ecrfSearch");
  var q=normDash((input?input.value:"").trim().toLowerCase());
  var rows=document.querySelectorAll("#ecrfMatrixBody tr");
  var shown=0;
  rows.forEach(function(row){
    var hay=normDash((row.getAttribute("data-search")||"").toLowerCase());
    var type=row.getAttribute("data-type")||"";
    var textOk=!q||hay.indexOf(q)!==-1;
    var typeOk=!activeTypeFilter||type===activeTypeFilter;
    var match=textOk&&typeOk;
    row.style.display=match?"":"none";
    if(match) shown++;
  });
  var noMatch=document.getElementById("ecrfNoMatch");
  if(noMatch) noMatch.style.display=shown?"none":"";
}
function wireEcrfFilters(){
  var input=document.getElementById("ecrfSearch");
  if(input) input.addEventListener("input",applyEcrfFilters);
  document.querySelectorAll("[data-type-filter]").forEach(function(chip){
    chip.addEventListener("click",function(){
      var val=chip.getAttribute("data-type-filter");
      activeTypeFilter=(activeTypeFilter===val)?null:val;
      document.querySelectorAll("[data-type-filter]").forEach(function(c){
        c.classList.toggle("active",c.getAttribute("data-type-filter")===activeTypeFilter);
      });
      applyEcrfFilters();
    });
  });
  applyEcrfFilters();
}
